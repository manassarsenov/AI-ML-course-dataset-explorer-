<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="M4C5 optional practice: compare experiment summaries in your own Dataset Explorer. Offline guide in English, Russian and Uzbek.">
<meta name="color-scheme" content="light">
<title>AI/ML · Dataset Explorer — compare experiments</title>
<style>
:root{--blue:#0757ff;--blue-deep:#0045d4;--ink:#08112e;--muted:#34415a;--line:#bdcce4;--pale:#e4edfc;--paper:#fff;--green:#116644;--green-pale:#edf8f1;--radius:18px}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:104px}
body{margin:0;background:#fcfdff;color:var(--ink);font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:600;line-height:1.58}
body:before{content:"";position:fixed;top:0;bottom:0;left:0;width:6px;background:var(--blue);z-index:9}
button,input{font:inherit}
button,a,input,summary{-webkit-tap-highlight-color:transparent}
button,a{touch-action:manipulation}
button{cursor:pointer}
a{color:var(--blue);text-underline-offset:3px}
a:hover{color:var(--blue-deep)}
button:focus-visible,a:focus-visible,summary:focus-visible,input:focus-visible{outline:3px solid #efb82f;outline-offset:4px}
button:disabled{cursor:default}
svg{display:block}
h1,h2,h3,h4,p{margin:0}
h1,h2,h3,h4{line-height:1.16}
.wrap{max-width:1192px;margin:auto;padding-left:36px;padding-right:36px}
.top{position:sticky;top:0;z-index:8;border-bottom:1px solid var(--line);background:rgba(255,255,255,.97)}
.top-row{min-height:78px;display:flex;gap:20px;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink);font-weight:800;font-size:14px;letter-spacing:.035em}
.brand svg{width:34px;height:34px;color:var(--blue)}
.brand small{display:block;font-size:10px;font-weight:500;color:var(--muted);letter-spacing:.13em}
.segmented{display:inline-flex;border:1px solid var(--line);padding:4px;border-radius:12px;background:#fff;gap:2px;max-width:100%}
.segmented button{border:0;background:transparent;padding:7px 14px;color:var(--muted);border-radius:8px;font-size:13px;font-weight:700;line-height:1.5;white-space:nowrap}
.segmented button[aria-pressed="true"]{background:var(--blue);color:#fff}
.segmented button:hover:not([aria-pressed="true"]){background:var(--pale);color:var(--ink)}
.hero{position:relative;overflow:hidden;padding-top:57px;padding-bottom:37px}
.hero:after{content:"";position:absolute;width:285px;height:285px;border:1px solid #edf1f8;border-radius:50%;right:-95px;top:0;box-shadow:0 0 0 27px #f5f7fc,0 0 0 28px #edf1f8;z-index:-1}
.eyebrow{text-transform:uppercase;letter-spacing:.13em;font-size:11px;color:var(--blue);font-weight:800}
.hero-grid{display:grid;grid-template-columns:1.5fr 1fr;align-items:center;gap:64px;margin-top:21px}
h1{font-size:clamp(42px,5.25vw,66px);font-weight:800;letter-spacing:-.055em;line-height:1.03}
h1 span{color:var(--blue);display:block}
.lede{font-size:17px;color:var(--muted);max-width:595px;margin-top:23px;line-height:1.65}
.hero-note{font-size:12px;margin-top:17px;color:var(--muted)}
.hero-sketch{position:relative;padding:20px 26px 22px;border:1px solid #bed0ff;background:#fff;border-radius:20px;box-shadow:0 12px 32px #0b316509;transform:rotate(1.5deg)}
.sketch-top{display:flex;gap:8px;align-items:center;border-bottom:1px solid var(--line);padding-bottom:15px;margin-bottom:19px;font-size:12px;font-weight:700;color:var(--muted)}
.sketch-top i{height:8px;width:8px;border:1px solid #a9c1f9;border-radius:50%}
.sketch-folder{display:flex;gap:10px;align-items:center;font-size:15px;font-weight:700}
.sketch-folder svg{height:25px;width:25px;color:var(--blue)}
.sketch-file{margin:10px 0 0 35px;font-family:Consolas,Menlo,monospace;font-size:13px;color:var(--muted)}
.sketch-file:before{content:"";display:inline-block;height:7px;width:7px;border-radius:2px;border:1px solid #b9c9e9;margin-right:9px}
.sketch-bottom{display:flex;align-items:center;gap:10px;margin-top:20px;padding-top:14px;border-top:1px solid var(--line);color:var(--blue);font-weight:700;font-size:12px}
.sketch-bottom svg{width:22px;height:22px}
.settings-bar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:20px 0 23px;border-bottom:1px solid var(--line)}
.setting-group{display:flex;align-items:center;gap:15px;flex-wrap:wrap}
.control-label{font-size:13px;font-weight:700}
.print{display:flex;align-items:center;gap:7px;background:none;border:0;padding:10px 0;color:var(--muted);font-size:13px;white-space:nowrap}
.print svg{height:17px;width:17px}
.layout{display:grid;grid-template-columns:176px minmax(0,1fr);gap:42px;padding-top:31px;padding-bottom:55px}
.side{align-self:start;position:sticky;top:109px}
.side p{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin:4px 0 13px}
.side a{display:flex;align-items:center;gap:10px;color:var(--muted);text-decoration:none;font-size:13px;padding:10px 0;line-height:1.35}
.side a:hover{color:var(--blue)}
.side a b{display:grid;place-items:center;flex-shrink:0;height:27px;width:27px;border-radius:50%;border:1px solid #cbd9f7;font-size:10px;color:var(--blue);background:white}
.side .side-bottom{font-size:11px;color:var(--muted);margin-top:23px;border-top:1px solid var(--line);padding-top:15px;line-height:1.6}
.content{min-width:0}
section{padding-bottom:39px;margin-bottom:35px;border-bottom:1px solid var(--line);scroll-margin-top:100px}
section:last-of-type{border:0;margin-bottom:0}
.section-head{display:flex;align-items:flex-start;gap:14px;margin-bottom:20px}
.step-num{display:grid;place-items:center;background:var(--blue);color:white;font-size:12px;font-weight:700;border-radius:50%;width:34px;height:34px;flex-shrink:0;margin-top:2px}
h2{font-size:27px;letter-spacing:-.035em;font-weight:800}
.section-head p{font-size:14px;color:var(--muted);margin-top:6px}
.agents{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.agent{border:1px solid var(--line);border-radius:var(--radius);background:white;text-align:left;padding:21px 18px 19px;position:relative;color:var(--ink);min-width:0}
.agent:hover{border-color:#90aeff}
.agent[aria-pressed="true"]{border:2px solid var(--blue);padding:20px 17px 18px;background:#f7faff}
.agent-symbol{width:36px;height:36px;display:grid;place-items:center;border:1px solid #c3d4fc;border-radius:11px;margin-bottom:18px;color:var(--blue);font-size:18px;font-weight:800;background:white}
.agent h3{font-size:18px;letter-spacing:-.03em}
.agent p{font-size:12px;line-height:1.5;color:var(--muted);margin-top:8px}
.agent .agent-tag{font-size:10px;font-weight:700;color:var(--blue);display:block;margin-top:14px}
.select-dot{position:absolute;right:16px;top:18px;height:15px;width:15px;border:1px solid #bbcae8;border-radius:50%}
.agent[aria-pressed="true"] .select-dot{border:4px solid var(--blue);background:white}
.note{margin-top:17px;border-left:3px solid var(--blue);padding:10px 14px;background:var(--pale);font-size:13px;line-height:1.6;border-radius:0 10px 10px 0}
.note.soft{background:#f6f8fc;border-left-color:#b8c7e6;color:var(--muted)}
.install-box{border:1px solid #b9ceff;border-radius:var(--radius);overflow:hidden;background:white}
.install-header{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:19px 23px;background:#f5f8ff;border-bottom:1px solid var(--line)}
.install-header h3{font-size:21px;letter-spacing:-.03em}
.small-tag{font-size:11px;font-weight:700;color:var(--blue);padding:4px 9px;border:1px solid #c1d3ff;border-radius:6px;white-space:nowrap;background:white}
.install-steps{list-style:none;padding:8px 23px 5px;margin:0}
.install-steps li{padding:17px 0;display:grid;grid-template-columns:25px minmax(0,1fr);gap:11px;border-bottom:1px solid #edf1f8}
.install-steps li:last-child{border-bottom:0}
.tiny-num{font-size:11px;font-weight:700;color:var(--blue);background:var(--pale);border-radius:6px;height:23px;display:grid;place-items:center}
.install-steps h4{font-size:15px;margin:2px 0 7px;line-height:1.35}
.install-steps p{font-size:14px;color:var(--muted)}
.text-link{display:inline-flex;align-items:center;gap:6px;margin-top:10px;text-decoration:none;font-weight:700;font-size:12px}
.text-link:after{content:"↗";font-size:14px}
.access{padding:14px 23px;background:#f8faff;color:var(--muted);font-size:12px;border-top:1px solid var(--line)}
.rules-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:22px}
.rule-card{padding:18px 19px;border:1px solid var(--line);background:#fff;border-radius:14px}
.rule-label{font-size:10px;font-weight:800;color:var(--blue);letter-spacing:.09em;text-transform:uppercase;margin-bottom:9px}
.rule-card h3{font-size:16px;margin-bottom:9px}
.rule-card p{font-size:13px;color:var(--muted)}
.rule-card .mini{margin-top:11px;font-size:12px;color:var(--ink)}
.effort-line{display:flex;gap:6px;margin:12px 0}
.effort-line span{font-size:10px;line-height:1.3;padding:6px 9px;background:#f3f6fc;border:1px solid var(--line);border-radius:6px}
.effort-line span:nth-child(2){color:var(--blue);border-color:#c2d4ff;background:var(--pale)}
details{border:1px solid var(--line);border-radius:12px;background:#fff;margin-top:14px;overflow:hidden}
summary{cursor:pointer;font-size:13px;font-weight:700;padding:15px 17px;list-style:none;display:flex;align-items:center;justify-content:space-between;gap:10px}
summary::-webkit-details-marker{display:none}
summary:after{content:"+";font-size:21px;font-weight:400;color:var(--blue);line-height:1}
details[open] summary:after{content:"−"}
.details-body{padding:0 17px 17px;font-size:13px;color:var(--muted)}
.details-body p+p{margin-top:12px}
.tools-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tool{border:1px solid var(--line);border-radius:14px;background:#fff;padding:20px;min-width:0}
.tool h3{font-size:17px;letter-spacing:-.02em;margin-bottom:9px}
.tool p{font-size:13px;color:var(--muted)}
.tool .cmd{margin-top:13px}
.cmd{position:relative;border:1px solid #d4e0f8;border-radius:11px;background:#f5f8ff;margin:11px 0 6px;min-width:0;overflow:hidden}
.cmd-bar{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:8px 12px;border-bottom:1px solid #e1e9f8}
.cmd-label{font-size:10px;font-weight:700;letter-spacing:.035em;color:var(--muted)}
.copy{border:0;background:#fff;border-radius:5px;padding:4px 8px;font-size:10px;font-weight:700;color:var(--blue);white-space:nowrap}
.copy:hover{background:#e6eeff}
pre{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;word-break:normal;padding:14px;font-family:Consolas,"Liberation Mono",Menlo,monospace;font-size:12px;line-height:1.7;color:#15386b}
code{font-family:Consolas,"Liberation Mono",Menlo,monospace;background:#edf3ff;color:#204a88;border-radius:4px;padding:2px 4px;font-size:.9em;overflow-wrap:anywhere}
pre code{background:none;color:inherit;padding:0;font-size:inherit}
.substep{margin-top:24px}
.substep h3{font-size:17px;letter-spacing:-.02em;margin-bottom:9px;line-height:1.35}
.substep>p{font-size:14px;color:var(--muted)}
.substep .tiny{font-size:12px;margin-top:8px}
.package-choice{display:flex;gap:7px;margin:12px 0 3px;flex-wrap:wrap}
.package-choice button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 11px;color:var(--muted);font-size:11px;font-weight:700}
.package-choice button[aria-pressed="true"]{border-color:var(--blue);color:var(--blue);background:var(--pale)}
.prompt-box{margin-top:13px}
.prompt-box pre{font-family:Arial,Helvetica,sans-serif;font-size:14px;line-height:1.75;color:var(--ink);padding:18px 19px;white-space:pre-wrap}
.result-box{border:1px solid #bfd4fd;border-radius:12px;padding:16px 18px;background:white;margin-top:17px}
.result-box h4{font-size:13px;color:var(--blue);margin-bottom:8px}
.result-box p{font-size:13px;color:var(--muted)}
.microflow{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:18px}
.microflow div{border:1px solid var(--line);border-radius:9px;padding:11px 10px;font-size:11px;color:var(--muted);line-height:1.5;background:white}
.microflow b{display:block;font-size:13px;color:var(--blue);margin-bottom:3px}
.check-box{border:1px solid #b8ceff;border-radius:var(--radius);background:white;overflow:hidden}
.check-top{padding:19px 22px;background:var(--pale);border-bottom:1px solid var(--line)}
.check-top-row{display:flex;align-items:center;justify-content:space-between;gap:13px}
.check-top h3{font-size:17px;line-height:1.3}
.count{font-size:14px;color:var(--blue);font-weight:700;white-space:nowrap}
.meter{background:#dbe6ff;height:4px;border-radius:3px;margin-top:14px;overflow:hidden}
.meter div{height:100%;background:var(--blue);width:0;transition:width .2s}
.checks{padding:5px 21px}
.check-row{display:flex;gap:12px;align-items:flex-start;cursor:pointer;padding:14px 0;border-bottom:1px solid #edf1f8;font-size:13px;line-height:1.6}
.check-row:last-child{border:0}
.check-row input{margin:4px 0 0;flex:0 0 17px;width:17px;height:17px;accent-color:var(--blue);cursor:pointer}
.check-row input:checked+span{color:var(--green)}
.check-bottom{padding:15px 21px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-start;gap:20px}
.check-bottom p{font-size:11px;color:var(--muted);max-width:520px}
.reset{padding:2px 0;border:0;background:none;color:var(--blue);font-size:11px;font-weight:700;white-space:nowrap}
.complete{margin-top:14px;padding:15px 18px;color:var(--green);background:var(--green-pale);border:1px solid #bdddc9;border-radius:11px;font-size:13px}
.helper-head{font-size:18px;margin-top:26px;letter-spacing:-.02em}
.sources{margin-top:26px}
.source-links{display:grid;grid-template-columns:1fr 1fr;gap:10px 20px}
.source-links a{font-size:12px;line-height:1.5;text-decoration:none}
.source-links a:hover{text-decoration:underline}
.source-meta{margin-top:15px!important;font-size:11px}
footer{border-top:1px solid var(--line);padding:24px 0 30px;background:white}
.footer-row{display:flex;align-items:center;justify-content:space-between;gap:25px;font-size:11px;color:var(--muted)}
.footer-row strong{color:var(--ink);font-size:12px}
.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:var(--ink);color:white;font-size:13px;padding:10px 18px;border-radius:10px;z-index:15;box-shadow:0 5px 20px #08112e22;max-width:90vw;text-align:center}
.skip{position:fixed;top:-80px;left:20px;z-index:20;background:white;padding:10px}
.skip:focus{top:10px}
.noscript{margin:30px;padding:25px;border:2px solid var(--blue);font-size:16px}
[hidden]{display:none!important}
@media(min-width:1500px){.wrap{max-width:1250px}.layout{gap:55px}}
@media(max-width:900px){.hero-grid{gap:28px;grid-template-columns:1.3fr 1fr}.wrap{padding-left:28px;padding-right:24px}.layout{grid-template-columns:1fr;gap:0}.side{position:static;display:flex;flex-wrap:wrap;gap:10px 18px;margin-bottom:28px}.side p,.side-bottom{display:none}.side a{padding:0;font-size:11px}.side a b{width:23px;height:23px;font-size:9px}.hero{padding-top:39px}.hero-sketch{padding:19px}.layout{padding-top:23px}}

/* Readable instruction cards */
.install-box{background:#eaf0fa;border-color:#afc3e6}
.install-header,.check-top{background:#dce7fa}
.install-steps li{border-bottom-color:#c5d3e9}
.install-steps p,.substep>p,.rule-card p,.details-body,.result-box p,.check-row{font-weight:600}
.install-steps h4,.substep h3{font-weight:800}
.rule-card,.result-box,.tool,.microflow div,details{background:#eaf0fa;border-color:#bdcce4}
.substep{padding:20px 22px;background:#eaf0fa;border:1px solid #bdcce4;border-radius:14px;margin-top:16px}
.permission-card{background:#dfe9fb;border-color:#9fb9e8;border-left:4px solid var(--blue)}
.note.soft{background:#e8edf5;border-left-color:#99adc9;color:#34415a}
.access{background:#dde7f6;font-weight:600}
.cmd{background:#dfe9fa;border-color:#adbfde}
.cmd-bar{background:#cfddf4;border-bottom-color:#adbfde;padding:12px 16px}
.cmd-label{font-size:11px;color:#263c62;font-weight:800}
.copy{font-size:12px;padding:6px 12px;border:1px solid #b0c4e7}
.prompt-box pre{font-size:15px;font-weight:600;background:#e8effc;line-height:1.8}
.check-box{background:#edf2fa}
.check-row{border-bottom-color:#c8d5e8}
.agent p,.lede,.section-head p{font-weight:600}
strong{font-weight:800}
@media(max-width:620px){.substep{padding:17px}.prompt-box pre{font-size:14px}.cmd-label{font-size:10px}.copy{font-size:11px}}

/* M3C2 additions; colors, type, spacing and components follow the M2 setup reference. */
.hero-sketch{transform:none;margin:0;padding:22px;background:#fff;box-shadow:0 12px 32px #0b316509}
.hero-sketch .sketch-top{margin-bottom:18px;line-height:1.5}

.value-group.flagged{background:#fff7e9;border-color:#efc879;text-align:center}

.flagged-number{display:block;font-size:46px;font-weight:800;letter-spacing:-.06em;line-height:1.2;color:#a15d08;margin-top:9px;font-variant-numeric:tabular-nums}
.iqr-boundaries{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:16px;padding:12px 13px;border:1px solid var(--line);border-radius:10px}
.iqr-boundaries span{font-size:11px;font-weight:600;color:var(--muted);line-height:1.5;max-width:185px}
.iqr-boundaries strong{font-size:25px;font-weight:800;letter-spacing:-.04em;color:var(--blue);white-space:nowrap;font-variant-numeric:tabular-nums}
.iqr-explanation{font-size:12px;line-height:1.6;margin-top:10px;color:var(--ink)}
.hero-sketch .sketch-bottom{margin-top:15px;font-size:12px;line-height:1.5}
.hero-sketch .sketch-bottom svg{flex-shrink:0}
.route-label{font-size:13px;color:var(--muted)}
.downloads{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:20px}
.download-card{border:1px solid var(--line);border-radius:14px;background:#fff;padding:20px;min-width:0}
.download-card h3{font-size:17px;margin-bottom:9px}

.action{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--blue);color:#fff;border:1px solid var(--blue);border-radius:9px;padding:10px 14px;font-size:12px;font-weight:700;min-height:42px;margin-top:15px}
.action:hover{background:var(--blue-deep)}
.download-card .cmd{margin-top:14px}
.guide-list{padding-left:20px;margin:12px 0 0;font-size:14px;color:var(--muted)}
.guide-list li{padding:4px 0 7px}
.guide-list strong{color:var(--ink)}
.table-wrap{overflow-x:auto;margin-top:15px;border:1px solid var(--line);border-radius:10px;background:white}
table{border-collapse:collapse;width:100%;font-size:13px;line-height:1.5}
caption{text-align:left;padding:12px 14px;font-weight:700;background:#f5f8ff;color:var(--ink)}
th,td{text-align:left;vertical-align:top;padding:11px 14px;border-top:1px solid #e3ebfa}
th{font-weight:700;color:var(--ink)}
td{font-weight:500;color:var(--muted)}
thead th{font-size:11px;color:var(--blue);background:#f9fbff}
.note strong{color:var(--ink)}
.bonus{margin-top:26px;border:1px solid #b9ceff;border-radius:14px}
.bonus summary{font-size:15px;color:var(--blue);padding:18px}
.bonus .details-body{padding:0 18px 20px}
.bonus h3{font-size:17px;margin:18px 0 9px;color:var(--ink)}
.bonus p{font-size:14px}
.bonus .prompt-box pre{font-size:13px}
.empty-tip{font-size:12px;color:var(--muted);margin-top:12px}
.complete[hidden]{display:none!important}
.cmd-bar{flex-wrap:wrap;gap:8px}
.cmd-label{min-width:0;overflow-wrap:anywhere;flex:1 1 170px}
.copy{min-height:32px;flex:0 0 auto}
.action{max-width:100%;overflow-wrap:anywhere;white-space:normal}
[tabindex]:focus-visible{outline:3px solid #efb82f;outline-offset:4px}
.own-request{margin-top:20px;border:1px solid #b9ceff;background:#f8faff;border-radius:14px;padding:20px}

.experiment-stats{display:grid;gap:10px}
.experiment-stat{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;gap:12px;padding:16px 13px;background:#f8faff;border:1px solid var(--line);border-radius:11px}
.experiment-stat>span:first-child{font-size:12px;color:var(--muted)}
.experiment-stat strong{font-size:23px;white-space:nowrap;letter-spacing:-.04em}
.experiment-delta{padding:4px 7px;border-radius:6px;background:#edf8f1;color:#155d39;font-size:12px;font-weight:800;white-space:nowrap}
.experiment-foot{font-size:12px;line-height:1.6;margin-top:16px;padding-top:14px;border-top:1px solid var(--line);color:var(--muted)}
.compact-details{margin-top:17px}
.finale{margin:0 0 28px;padding:22px;border:1px solid #bfd4fd;background:var(--pale);border-radius:var(--radius)}

const STORAGE_KEY = "aiml-m4c5-experiment-compare-v1";
const OS_NAMES = {win: "Windows", mac: "macOS", linux: "Linux"};
const state = {lang: "en", os: "win", checks: [false, false, false, false, false]};
try {
  const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");
  if (saved && typeof saved === "object") {
    if (Object.prototype.hasOwnProperty.call(T, saved.lang)) state.lang = saved.lang;
    if (Object.prototype.hasOwnProperty.call(OS_NAMES, saved.os)) state.os = saved.os;
    if (Array.isArray(saved.checks)) state.checks = state.checks.map((_, i) => saved.checks[i] === true);
  }
} catch (_) { /* Offline/private browser storage can be unavailable. */ }
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"}[c]));
const ICONS = {
  inspect: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="10" cy="10" r="6.5"/><path d="m15 15 5 5M10 7v4m0 2v.1"/></svg>',
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m7.5 12 3 3 6-6"/></svg>',
  print: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M6 8V3h12v5M6 17H3V8h18v9h-3M6 14h12v7H6z"/><path d="M17 11h1"/></svg>'
};
function persist() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (_) {} }
function list(items) { return '<ol class="guide-list">' + items.map(s => '<li>' + s + '</li>').join("") + '</ol>'; }
function head(n, title, sub) { return '<div class="section-head"><span class="step-num">0' + n + '</span><div><h2>' + esc(title) + '</h2><p>' + esc(sub) + '</p></div></div>'; }
function block(text, label, id, prompt = true) {
  return '<div class="cmd' + (prompt ? ' prompt-box' : '') + '"><div class="cmd-bar"><span class="cmd-label">' + esc(label) + '</span><button type="button" class="copy" data-copy="' + id + '" aria-label="' + esc(T[state.lang].copy + ': ' + label) + '">' + esc(T[state.lang].copy) + '</button></div><pre id="' + id + '">' + esc(text) + '</pre></div>';
}
function ownRequest(points, intro = "") {
  const t = T[state.lang];
  return '<div class="own-request"><h3>' + esc(t.ownTitle) + '</h3>' + (intro ? '<p>' + esc(intro) + '</p>' : '') + list(points) + '<p>' + esc(t.ownSend) + '</p></div>';
}
function promptHelp(text, label, id) {
  const t = T[state.lang];
  const context = t.systemContext + ': ' + OS_NAMES[state.os] + '.\n' + t.systemInstruction;
  return '<details class="prompt-help" id="' + id + '-help" data-prompt-help><summary>' + esc(t.promptHelpTitle) + '</summary><div class="details-body"><p>' + esc(t.promptHelpIntro) + '</p>' + block(context + '\n\n' + text, label, id) + '</div></details>';
}
function table(caption, headers, rows) {
  return '<div class="table-wrap" tabindex="0" role="region" aria-label="' + esc(caption) + '"><table><caption>' + esc(caption) + '</caption><thead><tr>' + headers.map(h => '<th scope="col">' + esc(h) + '</th>').join("") + '</tr></thead><tbody>' + rows.map(r => '<tr>' + r.map((c, i) => (i === 0 ? '<th scope="row">' : '<td>') + esc(c) + (i === 0 ? '</th>' : '</td>')).join("") + '</tr>').join("") + '</tbody></table></div>';
}
function downloadCard(kind, title, text) {
  const t = T[state.lang];
  return '<article class="download-card"><h3>' + esc(title) + '</h3><p>' + esc(text) + '</p><button type="button" class="action" data-download="' + kind + '">' + esc(t.download) + ' ' + FILES[kind] + '</button><details id="contents-' + kind + '"><summary>' + esc(t.csvContents) + '</summary><div class="details-body">' + block(CSV[kind], FILES[kind], 'csv-' + kind, false) + '<p class="empty-tip">' + esc(t.csvFallback) + '</p></div></details></article>';
}
function render() {
  const t = T[state.lang];
  document.documentElement.lang = state.lang;
  document.title = "AI/ML · " + t.footer;
  document.getElementById("skip").textContent = t.skip;
  document.getElementById("language").setAttribute("aria-label", t.language);
  document.querySelectorAll("[data-lang]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === state.lang)));
  const osControl = '<div class="segmented" role="group" aria-label="' + esc(t.systemLabel) + '">' + Object.entries(OS_NAMES).map(([id, name]) => '<button type="button" data-os="' + id + '" aria-pressed="' + (id === state.os) + '">' + name + '</button>').join("") + '</div>';
  const nav = t.nav.map((n, i) => '<a href="#' + IDS[i] + '"><b>0' + (i + 1) + '</b>' + esc(n) + '</a>').join("");
  document.getElementById("app").innerHTML = `
  <div class="wrap hero" id="top"><p class="eyebrow">${esc(t.eyebrow)}</p><div class="hero-grid">
    <div><h1>${esc(t.title)} <span>${esc(t.accent)}</span></h1><p class="lede">${esc(t.lede)}</p><p class="hero-note">${esc(t.heroNote)}</p></div>
    <figure class="hero-sketch" aria-label="${esc(t.heroCaption)}"><figcaption class="sketch-top"><i aria-hidden="true"></i><i aria-hidden="true"></i><i aria-hidden="true"></i>${esc(t.heroCaption)}</figcaption>
      <div class="experiment-stats"><div class="experiment-stat"><span>${esc(t.heroRows)}</span><strong>0.60 → 0.63</strong><span class="experiment-delta">+0.03</span></div><div class="experiment-stat"><span>${esc(t.heroColumns)}</span><strong>0.64 → 0.67</strong><span class="experiment-delta">+0.03</span></div><div class="experiment-stat"><span>${esc(t.heroMissing)}</span><strong>0.57 → 0.59</strong><span class="experiment-delta">+0.02</span></div></div>
      <p class="experiment-foot">${esc(t.heroFoot)}</p>
    </figure></div></div>
  <div class="wrap"><div class="settings-bar"><div class="setting-group"><span class="control-label">${esc(t.systemLabel)}</span>${osControl}</div><button class="print" type="button" data-print>${ICONS.print}${esc(t.print)}</button></div><p class="route-note">${esc(t.routeLabel)}</p></div>
  <div class="wrap layout"><nav class="side" aria-label="${esc(t.navTitle)}"><p>${esc(t.navTitle)}</p>${nav}<div class="side-bottom">${esc(t.sideNote)}</div></nav>
  <main class="content" id="guide" tabindex="-1">
    <section id="open">${head(1,t.openTitle,t.openSub)}<p class="note" id="system-tip"><strong>${esc(t.systemLabel)}: ${esc(OS_NAMES[state.os])}.</strong> ${esc(t.osTips[state.os])}</p>${list(t.openItems)}<p class="note soft">${esc(t.openNote)}</p><details class="compact-details" id="launch-options"><summary>${esc(t.launchTitle)}</summary><div class="details-body">${ownRequest(t.launchPoints,t.launchTask)}${promptHelp(t.launchPrompt,t.launchLabel,'launch-prompt')}</div></details></section>
    <section id="plan">${head(2,t.planTitle,t.planSub)}${list(t.planItems)}<p class="note">${esc(t.predict)}</p><div class="downloads">${downloadCard('run_a',t.beforeTitle,t.beforeText)}${downloadCard('run_b',t.afterTitle,t.afterText)}</div></section>
    <section id="upgrade">${head(3,t.upgradeTitle,t.upgradeSub)}<p class="lede" style="margin-top:0;font-size:14px">${esc(t.promptIntro)}</p>${ownRequest(t.featurePoints)}${promptHelp(t.prompt,t.promptLabel,'feature-prompt')}<p class="note">${esc(t.afterPrompt)}</p></section>
    <section id="verify">${head(4,t.verifyTitle,t.verifySub)}${list(t.verifyItems)}${table(t.expectedCaption,t.expectedHeads,t.expectedRows)}<p class="note">${esc(t.verifyNote)}</p>
      <details id="context-checks"><summary>${esc(t.edgeTitle)}</summary><div class="details-body"><p>${esc(t.edgeText)}</p><div class="downloads">${downloadCard('missing',t.missingContextTitle,t.missingContextText)}${downloadCard('changed',t.changedSplitTitle,t.changedSplitText)}</div><h3 class="helper-head">${esc(t.missingTitle)}</h3><p>${esc(t.missingText)}</p><h3 class="helper-head">${esc(t.splitTitle)}</h3><p>${esc(t.splitText)}</p>${list(t.edgeChecks)}</div></details>
      <details id="repair"><summary>${esc(t.helpTitle)}</summary><div class="details-body"><p>${esc(t.helpText)}</p>${ownRequest(t.repairPoints)}${promptHelp(t.repair,t.repairLabel,'repair-prompt')}<p class="note soft">${esc(t.helpAfter)}</p></div></details>
    </section>
    <section id="save">${head(5,t.saveTitle,t.saveSub)}
      <div class="finale"><h3>${esc(t.revealTitle)}</h3><p>${esc(t.revealTask)}</p>${downloadCard('challenge',t.challengeTitle,t.challengeText)}
        <details id="challenge-answer" data-reveal><summary>${esc(t.revealSummary)}</summary><div class="details-body"><p class="note">${esc(t.revealText)}</p>${list(t.revealPoints)}${ownRequest(t.fixPoints)}${promptHelp(t.fixPrompt,t.fixLabel,'fix-prompt')}<p class="note soft">${esc(t.fixAfter)}</p></div></details>
      </div>
      <p class="note">${esc(t.explain)}</p><p class="lede save-copy">${esc(t.saveText)}</p>
      <div class="check-box"><div class="check-top"><div class="check-top-row"><h3>${esc(t.checkTitle)}</h3><span class="count" id="check-count" role="status" aria-live="polite"></span></div><div class="meter" aria-hidden="true"><div id="check-meter"></div></div></div><div class="checks">${t.checks.map((c,i)=>'<label class="check-row"><input type="checkbox" data-check="'+i+'"'+(state.checks[i]?' checked':'')+'><span>'+esc(c)+'</span></label>').join('')}</div><div class="check-bottom"><p>${esc(t.checkNote)}</p><button type="button" class="reset" data-reset>${esc(t.reset)}</button></div></div>
      <p class="complete" id="complete" role="status" hidden>${esc(t.complete)}</p>
    </section>
  </main></div><footer><div class="wrap footer-row"><strong>${esc(t.footer)}</strong><span>${esc(t.footerNote)}</span></div></footer>`;
  updateChecks();
}
function updateChecks() {
  const count = state.checks.filter(Boolean).length;
  document.getElementById("check-count").textContent = count + " / " + state.checks.length;
  document.getElementById("check-meter").style.width = (count / state.checks.length * 100) + "%";
  document.getElementById("complete").hidden = count !== state.checks.length;
}
let toastTimer;
function toast(message) {
  clearTimeout(toastTimer);
  const el = document.getElementById("toast");
  el.textContent = message; el.hidden = false;
  toastTimer = setTimeout(() => { el.hidden = true; }, 6500);
}
async function copyText(id) {
  const source = document.getElementById(id);
  if (!source) return;
  let copied = false;
  if (navigator.clipboard && window.isSecureContext) {
    try { await navigator.clipboard.writeText(source.textContent); copied = true; } catch (_) {}
  }
  if (!copied) {
    const area = document.createElement("textarea");
    area.value = source.textContent; area.readOnly = true;
    area.style.position = "fixed"; area.style.top = "-9999px";
    const previousFocus = document.activeElement;
    document.body.appendChild(area); area.select();
    try { copied = document.execCommand("copy"); } catch (_) {}
    area.remove();
    if (previousFocus && previousFocus.focus) previousFocus.focus({preventScroll: true});
  }
  if (copied) { toast(T[state.lang].copied); return; }
  const range = document.createRange(); range.selectNodeContents(source);
  const selection = window.getSelection(); selection.removeAllRanges(); selection.addRange(range);
  toast(T[state.lang].copyFail);
}
function downloadCsv(kind) {
  if (!Object.prototype.hasOwnProperty.call(CSV, kind)) return;
  const blob = new Blob([CSV[kind]], {type: "application/json;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a"); a.href = url; a.download = FILES[kind];
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  toast(T[state.lang].downloadStarted);
}
function switchSetting(key, value) {
  const y = window.scrollY;
  const opened = [...document.querySelectorAll("details[open]")].map(d => d.id).filter(Boolean);
  state[key] = value; persist(); render();
  opened.forEach(id => { const detail = document.getElementById(id); if (detail) detail.open = true; });
  document.getElementById("toast").hidden = true;
  window.scrollTo({top: y, behavior: "instant"});
  document.querySelector('[data-' + key + '="' + value + '"]').focus({preventScroll: true});
}
document.addEventListener("click", event => {
  const b = event.target.closest("button");
  if (!b) return;
  if (b.dataset.lang && Object.prototype.hasOwnProperty.call(T, b.dataset.lang)) {
    switchSetting('lang', b.dataset.lang);
  } else if (b.dataset.os && Object.prototype.hasOwnProperty.call(OS_NAMES, b.dataset.os)) {
    switchSetting('os', b.dataset.os);
  } else if (b.dataset.copy) { copyText(b.dataset.copy); }
  else if (b.dataset.download) { downloadCsv(b.dataset.download); }
  else if (b.hasAttribute("data-print")) { window.print(); }
  else if (b.hasAttribute("data-reset")) {
    state.checks = state.checks.map(() => false); persist();
    document.querySelectorAll("[data-check]").forEach(c => { c.checked = false; }); updateChecks();
  }
});
document.addEventListener("change", event => {
  if (!event.target.matches("[data-check]")) return;
  const index = Number(event.target.dataset.check);
  if (!Number.isInteger(index) || index < 0 || index >= state.checks.length) return;
  state.checks[index] = event.target.checked; persist(); updateChecks();
});
let printDetails = [];
window.addEventListener("beforeprint", () => {
  printDetails = [...document.querySelectorAll("details")].map(el => ({el, open: el.open}));
  printDetails.forEach(({el}) => { if (!el.hasAttribute('data-prompt-help') && !el.hasAttribute('data-reveal')) el.open = true; });
});
window.addEventListener("afterprint", () => { printDetails.forEach(({el, open}) => { el.open = open; }); });
render();
</script>
