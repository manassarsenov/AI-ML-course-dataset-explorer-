<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>Dataset Explorer · Small Upgrade</title>
<style>
:root{--blue:#0756F5;--ink:#101828;--muted:#475467;--line:#d0d5dd;--pale:#eff5ff;--paper:#fff}*{box-sizing:border-box}body{margin:0;background:#f5f8ff;color:var(--ink);font:19px/1.58 Arial, sans-serif}.wrap{max-width:900px;margin:auto;padding:26px 20px 56px}.sheet{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:clamp(22px,5vw,48px);box-shadow:0 8px 28px #163a7010}header{border-bottom:3px solid var(--blue);padding-bottom:22px;margin-bottom:28px}.eyebrow{color:var(--blue);font-size:14px;font-weight:700;letter-spacing:.08em}h1{font-size:clamp(32px,6vw,48px);line-height:1.12;margin:8px 0 12px}h2{font-size:25px;line-height:1.25;margin:0 0 8px}.lead{font-size:21px;color:#28364b;margin:0}.lang{display:flex;gap:8px;margin:0 0 20px}.lang button,.copy,.download{font:inherit;font-size:16px;font-weight:700;border:1px solid var(--blue);border-radius:8px;padding:9px 14px;background:white;color:var(--blue);cursor:pointer}.lang button[aria-pressed=true],.download{background:var(--blue);color:white}.step{padding:22px 0;border-bottom:1px solid var(--line)}.stephead{display:flex;gap:14px;align-items:flex-start}.stephead>div{min-width:0}.num{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--blue);color:white;font-weight:bold}.step p{margin:8px 0}.note{background:var(--pale);border-left:4px solid var(--blue);padding:12px 16px;border-radius:4px}.prompt{border:1px solid var(--line);border-radius:10px;margin:12px 0 18px;overflow:hidden}.promptbar{display:flex;align-items:center;justify-content:space-between;gap:12px;min-width:0;flex-wrap:wrap;background:#f1f4f9;padding:9px 12px;font-size:15px;font-weight:bold}.prompt pre{white-space:pre-wrap;overflow-wrap:anywhere;font:16px/1.55 Consolas,monospace;margin:0;padding:14px}.checks{padding-left:24px}.checks li{margin:7px 0}.actions{display:flex;gap:10px;flex-wrap:wrap}button:focus-visible,a:focus-visible{outline:3px solid #ffbf47;outline-offset:3px}.status{min-height:1.5em;color:#116644;font-size:16px}footer{font-size:15px;color:var(--muted);padding-top:22px} @media(max-width:560px){body{font-size:17px}.sheet{padding:22px 17px}.lang{flex-wrap:wrap}.prompt pre{font-size:14px}}
</style></head><body><main class="wrap"><nav class="lang" aria-label="Language"><button type="button" data-lang="en" aria-pressed="true">English</button><button type="button" data-lang="ru" aria-pressed="false">Русский</button><button type="button" data-lang="uz" aria-pressed="false">O‘zbekcha</button></nav><article class="sheet" id="guide"></article></main>
<script>
const CSV_TEST = 'row,amount,note\nA,10,ok\nB,"   ",ok\nC,,ok\nD,0," "\nE,30,ok\n';
const CSV_CONTROL = 'row,amount,note\nA,10,ok\nB,20,ok\nC,,ok\nD,0,ok\nE,30,ok\n';
const T = {
 en:{title:'A small upgrade for your Dataset Explorer',lead:'You already have your own app from M2. Add one useful check: find cells that contain only spaces.',steps:[['Open your existing project','Start the same project you made in M2. Keep its file and features. Upload the test CSV below.'],['Ask AI for one change, then check it','Copy the prompt. Ask AI to change your existing app, not make a new one. Run it and compare every number with the answer.'],['Optional: show the rows','If you have time, add a checkbox or button to show rows with spaces-only cells. Keep the normal summary and chart based on the full original table.'],['Explain and save','Tell your mentor what you found. Save your existing project. Restart the app and check the old upload, summary and chart.']],promptTitle:'PROMPT 1 · ADD THE COUNT',prompt:'In my existing Python + Streamlit + pandas CSV app, add a separate count for cells whose value is a string made only of one or more spaces. Show the count for every column and a total. Do not include ordinary empty/NaN values in this count. Do not count 0 or "0" as missing. Read the full table, not only the preview. Keep the source data unchanged: do not fill, trim, delete, or automatically clean values. Keep my existing upload, summary, and chart working. Make only this small change. Do not install new libraries. Use the project existing environment to run the app and check the change. Give me the local app URL. If you cannot run it or the run is blocked, say so clearly and tell me what prevented the check.',repairTitle:'REPAIR PROMPT · IF SOMETHING BREAKS',repair:'I tried to run the existing app after the change. Exact error message: [PASTE THE FULL ERROR HERE]. I expected: [WHAT I EXPECTED]. I actually saw: [WHAT HAPPENED]. Please fix only the new spaces-only count. Keep the original upload, summary, and chart. Do not clean or change uploaded data, and do not install new libraries. Use the existing project environment to run the app and check the fix. Give me the local app URL. If you cannot run it or the run is blocked, say so clearly and explain why.',prompt2Title:'PROMPT 2 · OPTIONAL ROW VIEW',prompt2:'Add one checkbox or button that shows only rows with at least one cell made only of spaces. This is an optional view. Do not change the uploaded table, the regular summary, or the chart; they must still use the full original table. Keep the app simple.',test:'DOWNLOAD TEST CSV',control:'DOWNLOAD CONTROL CSV',expectedTitle:'Check these known answers',expected:'5 rows · 3 columns. amount: 1 ordinary missing value and 1 spaces-only cell. note: 1 spaces-only cell. Total spaces-only cells: 2. Rows with spaces: B and D. The value 0 in row D is not missing.',controlNote:'In the control file, spaces-only count is 0. amount still has 1 ordinary missing value.',checksTitle:'Self-check',checks:['The new count is separate from ordinary empty values.','The count uses the whole table, not only the preview.','The original data stays unchanged; nothing is filled, trimmed, or deleted.','The old upload, summary, and chart still work after restarting.'],copy:'Copy',copied:'Copied',copyFail:'Text selected. Copy it manually.',status:'',footer:'Optional practice. Ask your mentor if you get stuck.'},
 ru:{title:'Небольшое улучшение Dataset Explorer',lead:'У тебя уже есть приложение из M2. Добавь одну полезную проверку: поиск ячеек, где есть только пробелы.',steps:[['Открой свой проект','Запусти тот же проект, который сделал в M2. Сохрани его файл и функции. Загрузи тестовый CSV ниже.'],['Попроси ИИ об одном изменении и проверь его','Скопируй запрос. Попроси ИИ изменить существующее приложение, а не создавать новое. Запусти его и сравни числа с ответом.'],['По желанию: покажи строки','Если останется время, добавь флажок или кнопку, чтобы показать строки с ячейками из одних пробелов. Обычная сводка и график должны считать всю исходную таблицу.'],['Объясни и сохрани','Расскажи наставнику, что нашёл. Сохрани существующий проект. Перезапусти приложение и проверь старую загрузку, сводку и график.']],promptTitle:'ЗАПРОС 1 · ДОБАВИТЬ СЧЁТЧИК',prompt:'В моём существующем приложении на Python + Streamlit + pandas для CSV добавь отдельный подсчёт ячеек, в которых строка состоит только из одного или нескольких пробелов. Покажи число для каждого столбца и общий итог. Не включай сюда обычные пустые значения/NaN. Не считай 0 или "0" пропуском. Проверяй всю таблицу, а не только предварительный просмотр. Не меняй исходные данные: не заполняй, не обрезай, не удаляй и не очищай значения автоматически. Сохрани работу старой загрузки, сводки и графика. Сделай только это небольшое изменение. Не устанавливай новые библиотеки. Запусти приложение в уже используемом окружении проекта, проверь изменение и дай локальную ссылку на приложение. Если запуск не удался или был заблокирован, прямо скажи об этом и объясни причину.',repairTitle:'ЗАПРОС ДЛЯ ИСПРАВЛЕНИЯ · ЕСЛИ ЧТО-ТО СЛОМАЛОСЬ',repair:'Я запустил существующее приложение после изменения. Точный текст ошибки: [ВСТАВЬ ПОЛНЫЙ ТЕКСТ ОШИБКИ]. Я ожидал: [ЧТО ДОЛЖНО БЫЛО ПРОИЗОЙТИ]. Фактически увидел: [ЧТО ПРОИЗОШЛО]. Исправь только новый подсчёт ячеек из одних пробелов. Сохрани старую загрузку, сводку и график. Не очищай и не меняй загруженные данные, не устанавливай новые библиотеки. Запусти приложение в уже используемом окружении и проверь исправление. Дай локальную ссылку на приложение. Если запуск не удался или был заблокирован, прямо скажи об этом и объясни причину.',prompt2Title:'ЗАПРОС 2 · ПО ЖЕЛАНИЮ ПОКАЗАТЬ СТРОКИ',prompt2:'Добавь флажок или кнопку, которая показывает только строки, где есть хотя бы одна ячейка из одних пробелов. Это дополнительный вид. Не меняй загруженную таблицу, обычную сводку и график: они должны по-прежнему использовать всю исходную таблицу. Оставь приложение простым.',test:'СКАЧАТЬ ТЕСТОВЫЙ CSV',control:'СКАЧАТЬ КОНТРОЛЬНЫЙ CSV',expectedTitle:'Сверь с известными ответами',expected:'5 строк · 3 столбца. amount: 1 обычный пропуск и 1 ячейка из пробелов. note: 1 ячейка из пробелов. Всего ячеек из пробелов: 2. Строки с пробелами: B и D. Значение 0 в строке D — не пропуск.',controlNote:'В контрольном файле ячеек из пробелов — 0. В amount по-прежнему 1 обычный пропуск.',checksTitle:'Самопроверка',checks:['Новый счётчик отдельный от обычных пустых значений.','Счётчик проверяет всю таблицу, а не только предварительный просмотр.','Исходные данные не меняются: ничего не заполняется, не обрезается и не удаляется.','После перезапуска работают старая загрузка, сводка и график.'],copy:'Копировать',copied:'Скопировано',copyFail:'Текст выделен. Скопируй его вручную.',status:'',footer:'Практика необязательная. Если застрял, позови наставника.'},
 uz:{title:'Dataset Explorer uchun kichik yaxshilanish',lead:'Senda M2 dan o‘z ilovang bor. Faqat bo‘sh joylardan iborat kataklarni topadigan bitta tekshiruv qo‘sh.',steps:[['Mavjud loyihangni och','M2 da yaratgan loyihangni ishga tushir. Uning fayli va funksiyalarini saqla. Quyidagi sinov CSV faylini yukla.'],['AI dan bitta o‘zgarish so‘ra va tekshir','So‘rovni nusxala. AI dan yangi ilova yaratishni emas, mavjud ilovani o‘zgartirishni so‘ra. Ishga tushir va sonlarni javob bilan solishtir.'],['Ixtiyoriy: qatorlarni ko‘rsat','Vaqt qolsa, faqat bo‘sh joyli kataklari bor qatorlarni ko‘rsatadigan belgi yoki tugma qo‘sh. Oddiy xulosa va grafik butun asl jadval bo‘yicha hisoblansin.'],['Tushuntir va saqla','Topgan narsangni mentorga ayt. Mavjud loyihangni saqla. Ilovani qayta ishga tushir va eski yuklash, xulosa hamda grafikni tekshir.']],promptTitle:'1-SO‘ROV · HISOBLAGICH QO‘SHISH',prompt:'Mening mavjud Python + Streamlit + pandas CSV ilovamga qiymati faqat bir yoki bir nechta bo‘sh joydan iborat kataklar uchun alohida hisoblagich qo‘sh. Har bir ustun sonini va umumiy sonni ko‘rsat. Oddiy bo‘sh qiymatlar/NaN ni bu hisobga qo‘shma. 0 yoki "0" ni bo‘sh deb hisoblama. Faqat ko‘rinadigan qismni emas, butun jadvalni tekshir. Asl ma’lumotni o‘zgartirma: qiymatlarni to‘ldirma, bo‘sh joylarini kesma, o‘chirma va avtomatik tozalama. Eski yuklash, xulosa va grafik ishlashda davom etsin. Faqat shu kichik o‘zgarishni qil. Yangi kutubxonalarni o‘rnatma. Loyihaning mavjud muhitida ilovani ishga tushir, o‘zgarishni tekshir va mahalliy havolani ber. Agar ishga tushira olmasang yoki bunga to‘siq bo‘lsa, buni ochiq ayt va sababini tushuntir.',repairTitle:'TUZATISH SO‘ROVI · BIROR NARSA ISHLAMASA',repair:'O‘zgarishdan keyin mavjud ilovani ishga tushirdim. Xatoning aynan matni: [TO‘LIQ XATO MATNINI SHU YERGA QO‘Y]. Men kutgan natija: [KUTILGAN NATIJA]. Aslida ko‘rganim: [HAQIQIY NATIJA]. Faqat yangi bo‘sh joy hisoblagichini tuzat. Eski yuklash, xulosa va grafikni saqla. Yuklangan ma’lumotni o‘zgartirma yoki tozalama, yangi kutubxonalarni o‘rnatma. Loyihaning mavjud muhitida ilovani ishga tushirib, tuzatishni tekshir. Mahalliy havolani ber. Agar ishga tushira olmasang yoki bunga to‘siq bo‘lsa, ochiq ayt va sababini tushuntir.',prompt2Title:'2-SO‘ROV · IXTIYORIY QATORLARNI KO‘RISH',prompt2:'Faqat bo‘sh joylardan iborat kamida bitta katagi bor qatorlarni ko‘rsatadigan belgi yoki tugma qo‘sh. Bu ixtiyoriy ko‘rinish. Yuklangan jadval, oddiy xulosa yoki grafikni o‘zgartirma: ular butun asl jadvaldan foydalanishi kerak. Ilovani sodda saqla.',test:'SINOV CSV NI YUKLAB OLISH',control:'NAZORAT CSV NI YUKLAB OLISH',expectedTitle:'Ma’lum javoblar bilan tekshir',expected:'5 qator · 3 ustun. amount: 1 oddiy bo‘sh qiymat va bo‘sh joyli 1 katak. note: bo‘sh joyli 1 katak. Jami bo‘sh joyli kataklar: 2. Bo‘sh joyli qatorlar: B va D. D qatordagi 0 qiymati bo‘sh emas.',controlNote:'Nazorat faylida bo‘sh joyli kataklar soni 0. amount ustunida 1 oddiy bo‘sh qiymat qoladi.',checksTitle:'O‘zingni tekshir',checks:['Yangi hisoblagich oddiy bo‘sh qiymatlardan alohida.','Hisoblagich faqat ko‘rinadigan qismni emas, butun jadvalni tekshiradi.','Asl ma’lumot o‘zgarmaydi: hech narsa to‘ldirilmaydi, kesilmaydi yoki o‘chirilmaydi.','Qayta ishga tushirgandan keyin eski yuklash, xulosa va grafik ishlaydi.'],copy:'Nusxalash',copied:'Nusxalandi',copyFail:'Matn belgilandi. Uni qo‘lda nusxala.',status:'',footer:'Bu ixtiyoriy mashq. Qiynalsang, mentordan yordam so‘ra.'}
};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let lang='en';function promptBox(title,text,id){return `<section class="prompt"><div class="promptbar"><span>${esc(title)}</span><button class="copy" type="button" data-copy="${id}">${esc(T[lang].copy)}</button></div><pre id="${id}">${esc(text)}</pre></section>`}
function render(){const d=T[lang];document.documentElement.lang=lang;document.getElementById('guide').innerHTML=`<header><div class="eyebrow">AI/ML FUNDAMENTALS · YOUR M2 PROJECT</div><h1>${esc(d.title)}</h1><p class="lead">${esc(d.lead)}</p></header>${d.steps.map((s,i)=>`<section class="step"><div class="stephead"><span class="num">${i+1}</span><div><h2>${esc(s[0])}</h2><p>${esc(s[1])}</p>${i===0?`<div class="actions"><button class="download" data-download="test">${esc(d.test)}</button><button class="download" data-download="control">${esc(d.control)}</button></div>`:''}${i===1?promptBox(d.promptTitle,d.prompt,'p1')+promptBox(d.repairTitle,d.repair,'repair'):''}${i===2?promptBox(d.prompt2Title,d.prompt2,'p2'):''}${i===1?`<p class="note"><strong>${esc(d.expectedTitle)}:</strong> ${esc(d.expected)}<br>${esc(d.controlNote)}</p>`:''}</div></div></section>`).join('')}<section class="step"><h2>${esc(d.checksTitle)}</h2><ul class="checks">${d.checks.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></section><p class="status" id="status" aria-live="polite"></p><footer>${esc(d.footer)}</footer>`;document.querySelectorAll('[data-lang]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.lang===lang)));}
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.lang){lang=b.dataset.lang;render();return}if(b.dataset.download){const data=b.dataset.download==='test'?CSV_TEST:CSV_CONTROL;const blob=new Blob([data],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=b.dataset.download==='test'?'dataset_explorer_test.csv':'dataset_explorer_control.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);return}if(b.dataset.copy){const el=document.getElementById(b.dataset.copy),original=b.textContent;try{await navigator.clipboard.writeText(el.textContent);b.textContent=T[lang].copied;b.setAttribute('aria-live','polite');setTimeout(()=>{b.textContent=original;b.removeAttribute('aria-live')},2000)}catch{const r=document.createRange();r.selectNodeContents(el);const s=window.getSelection();s.removeAllRanges();s.addRange(r);b.textContent=T[lang].copyFail;b.setAttribute('aria-live','polite');setTimeout(()=>{b.textContent=original;b.removeAttribute('aria-live')},2000)}}});render();
</script></body></html>
