<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><meta name="description" content="Build your own Dataset Explorer with a coding agent. A beginner guide with prompts, test files and a checklist in English, Russian and Uzbek."><title>AI/ML · Build your Dataset Explorer</title><style>
:root{--blue:#0757ff;--blue-deep:#0045d4;--ink:#08112e;--muted:#34415a;--line:#bdcce4;--pale:#e4edfc;--paper:#fff;--green:#116644;--green-pale:#edf8f1;--radius:18px}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:104px}
body{margin:0;background:#fcfdff;color:var(--ink);font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:600;line-height:1.58}
body:before{content:"";position:fixed;top:0;bottom:0;left:0;width:6px;background:var(--blue);z-index:9}
button,input{font:inherit}
button,a,input,summary{-webkit-tap-highlight-color:transparent}
button,a{touch-action:manipulation}
button{cursor:pointer}
a{color:var(--blue);text-underline-offset:3px}
a:hover{color:var(--blue-deep)}
button:focus-visible,a:focus-visible,summary:focus-visible,input:focus-visible{outline:3px solid #efb82f;outline-offset:4px}
button:disabled{cursor:default}
svg{display:block}
h1,h2,h3,h4,p{margin:0}
h1,h2,h3,h4{line-height:1.16}
.wrap{max-width:1192px;margin:auto;padding-left:36px;padding-right:36px}
.top{position:sticky;top:0;z-index:8;border-bottom:1px solid var(--line);background:rgba(255,255,255,.97)}
.top-row{min-height:78px;display:flex;gap:20px;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink);font-weight:800;font-size:14px;letter-spacing:.035em}
.brand svg{width:34px;height:34px;color:var(--blue)}
.brand small{display:block;font-size:10px;font-weight:500;color:var(--muted);letter-spacing:.13em}
.segmented{display:inline-flex;border:1px solid var(--line);padding:4px;border-radius:12px;background:#fff;gap:2px;max-width:100%}
.segmented button{border:0;background:transparent;padding:7px 14px;color:var(--muted);border-radius:8px;font-size:13px;font-weight:700;line-height:1.5;white-space:nowrap}
.segmented button[aria-pressed="true"]{background:var(--blue);color:#fff}
.segmented button:hover:not([aria-pressed="true"]){background:var(--pale);color:var(--ink)}
.hero{position:relative;overflow:hidden;padding-top:57px;padding-bottom:37px}
.hero:after{content:"";position:absolute;width:285px;height:285px;border:1px solid #edf1f8;border-radius:50%;right:-95px;top:0;box-shadow:0 0 0 27px #f5f7fc,0 0 0 28px #edf1f8;z-index:-1}
.eyebrow{text-transform:uppercase;letter-spacing:.13em;font-size:11px;color:var(--blue);font-weight:800}
.hero-grid{display:grid;grid-template-columns:1.5fr 1fr;align-items:center;gap:64px;margin-top:21px}
h1{font-size:clamp(42px,5.25vw,66px);font-weight:800;letter-spacing:-.055em;line-height:1.03}
h1 span{color:var(--blue);display:block}
.lede{font-size:17px;color:var(--muted);max-width:595px;margin-top:23px;line-height:1.65}
.hero-note{font-size:12px;margin-top:17px;color:var(--muted)}
.hero-sketch{position:relative;padding:20px 26px 22px;border:1px solid #bed0ff;background:#fff;border-radius:20px;box-shadow:0 12px 32px #0b316509;transform:rotate(1.5deg)}
.sketch-top{display:flex;gap:8px;align-items:center;border-bottom:1px solid var(--line);padding-bottom:15px;margin-bottom:19px;font-size:12px;font-weight:700;color:var(--muted)}
.sketch-top i{height:8px;width:8px;border:1px solid #a9c1f9;border-radius:50%}
.sketch-folder{display:flex;gap:10px;align-items:center;font-size:15px;font-weight:700}
.sketch-folder svg{height:25px;width:25px;color:var(--blue)}
.sketch-file{margin:10px 0 0 35px;font-family:Consolas,Menlo,monospace;font-size:13px;color:var(--muted)}
.sketch-file:before{content:"";display:inline-block;height:7px;width:7px;border-radius:2px;border:1px solid #b9c9e9;margin-right:9px}
.sketch-bottom{display:flex;align-items:center;gap:10px;margin-top:20px;padding-top:14px;border-top:1px solid var(--line);color:var(--blue);font-weight:700;font-size:12px}
.sketch-bottom svg{width:22px;height:22px}
.settings-bar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:20px 0 23px;border-bottom:1px solid var(--line)}
.setting-group{display:flex;align-items:center;gap:15px;flex-wrap:wrap}
.control-label{font-size:13px;font-weight:700}
.print{display:flex;align-items:center;gap:7px;background:none;border:0;padding:10px 0;color:var(--muted);font-size:13px;white-space:nowrap}
.print svg{height:17px;width:17px}
.layout{display:grid;grid-template-columns:176px minmax(0,1fr);gap:42px;padding-top:31px;padding-bottom:55px}
.side{align-self:start;position:sticky;top:109px}
.side p{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin:4px 0 13px}
.side a{display:flex;align-items:center;gap:10px;color:var(--muted);text-decoration:none;font-size:13px;padding:10px 0;line-height:1.35}
.side a:hover{color:var(--blue)}
.side a b{display:grid;place-items:center;flex-shrink:0;height:27px;width:27px;border-radius:50%;border:1px solid #cbd9f7;font-size:10px;color:var(--blue);background:white}
.side .side-bottom{font-size:11px;color:var(--muted);margin-top:23px;border-top:1px solid var(--line);padding-top:15px;line-height:1.6}
.content{min-width:0}
section{padding-bottom:39px;margin-bottom:35px;border-bottom:1px solid var(--line);scroll-margin-top:100px}
section:last-of-type{border:0;margin-bottom:0}
.section-head{display:flex;align-items:flex-start;gap:14px;margin-bottom:20px}
.step-num{display:grid;place-items:center;background:var(--blue);color:white;font-size:12px;font-weight:700;border-radius:50%;width:34px;height:34px;flex-shrink:0;margin-top:2px}
h2{font-size:27px;letter-spacing:-.035em;font-weight:800}
.section-head p{font-size:14px;color:var(--muted);margin-top:6px}
.agents{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.agent{border:1px solid var(--line);border-radius:var(--radius);background:white;text-align:left;padding:21px 18px 19px;position:relative;color:var(--ink);min-width:0}
.agent:hover{border-color:#90aeff}
.agent[aria-pressed="true"]{border:2px solid var(--blue);padding:20px 17px 18px;background:#f7faff}
.agent-symbol{width:36px;height:36px;display:grid;place-items:center;border:1px solid #c3d4fc;border-radius:11px;margin-bottom:18px;color:var(--blue);font-size:18px;font-weight:800;background:white}
.agent h3{font-size:18px;letter-spacing:-.03em}
.agent p{font-size:12px;line-height:1.5;color:var(--muted);margin-top:8px}
.agent .agent-tag{font-size:10px;font-weight:700;color:var(--blue);display:block;margin-top:14px}
.select-dot{position:absolute;right:16px;top:18px;height:15px;width:15px;border:1px solid #bbcae8;border-radius:50%}
.agent[aria-pressed="true"] .select-dot{border:4px solid var(--blue);background:white}
.note{margin-top:17px;border-left:3px solid var(--blue);padding:10px 14px;background:var(--pale);font-size:13px;line-height:1.6;border-radius:0 10px 10px 0}
.note.soft{background:#f6f8fc;border-left-color:#b8c7e6;color:var(--muted)}
.install-box{border:1px solid #b9ceff;border-radius:var(--radius);overflow:hidden;background:white}
.install-header{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:19px 23px;background:#f5f8ff;border-bottom:1px solid var(--line)}
.install-header h3{font-size:21px;letter-spacing:-.03em}
.small-tag{font-size:11px;font-weight:700;color:var(--blue);padding:4px 9px;border:1px solid #c1d3ff;border-radius:6px;white-space:nowrap;background:white}
.install-steps{list-style:none;padding:8px 23px 5px;margin:0}
.install-steps li{padding:17px 0;display:grid;grid-template-columns:25px minmax(0,1fr);gap:11px;border-bottom:1px solid #edf1f8}
.install-steps li:last-child{border-bottom:0}
.tiny-num{font-size:11px;font-weight:700;color:var(--blue);background:var(--pale);border-radius:6px;height:23px;display:grid;place-items:center}
.install-steps h4{font-size:15px;margin:2px 0 7px;line-height:1.35}
.install-steps p{font-size:14px;color:var(--muted)}
.text-link{display:inline-flex;align-items:center;gap:6px;margin-top:10px;text-decoration:none;font-weight:700;font-size:12px}
.text-link:after{content:"↗";font-size:14px}
.access{padding:14px 23px;background:#f8faff;color:var(--muted);font-size:12px;border-top:1px solid var(--line)}
.rules-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:22px}
.rule-card{padding:18px 19px;border:1px solid var(--line);background:#fff;border-radius:14px}
.rule-label{font-size:10px;font-weight:800;color:var(--blue);letter-spacing:.09em;text-transform:uppercase;margin-bottom:9px}
.rule-card h3{font-size:16px;margin-bottom:9px}
.rule-card p{font-size:13px;color:var(--muted)}
.rule-card .mini{margin-top:11px;font-size:12px;color:var(--ink)}
.effort-line{display:flex;gap:6px;margin:12px 0}
.effort-line span{font-size:10px;line-height:1.3;padding:6px 9px;background:#f3f6fc;border:1px solid var(--line);border-radius:6px}
.effort-line span:nth-child(2){color:var(--blue);border-color:#c2d4ff;background:var(--pale)}
details{border:1px solid var(--line);border-radius:12px;background:#fff;margin-top:14px;overflow:hidden}
summary{cursor:pointer;font-size:13px;font-weight:700;padding:15px 17px;list-style:none;display:flex;align-items:center;justify-content:space-between;gap:10px}
summary::-webkit-details-marker{display:none}
summary:after{content:"+";font-size:21px;font-weight:400;color:var(--blue);line-height:1}
details[open] summary:after{content:"−"}
.details-body{padding:0 17px 17px;font-size:13px;color:var(--muted)}
.details-body p+p{margin-top:12px}
.tools-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tool{border:1px solid var(--line);border-radius:14px;background:#fff;padding:20px;min-width:0}
.tool h3{font-size:17px;letter-spacing:-.02em;margin-bottom:9px}
.tool p{font-size:13px;color:var(--muted)}
.tool .cmd{margin-top:13px}
.cmd{position:relative;border:1px solid #d4e0f8;border-radius:11px;background:#f5f8ff;margin:11px 0 6px;min-width:0;overflow:hidden}
.cmd-bar{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:8px 12px;border-bottom:1px solid #e1e9f8}
.cmd-label{font-size:10px;font-weight:700;letter-spacing:.035em;color:var(--muted)}
.copy{border:0;background:#fff;border-radius:5px;padding:4px 8px;font-size:10px;font-weight:700;color:var(--blue);white-space:nowrap}
.copy:hover{background:#e6eeff}
pre{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;word-break:normal;padding:14px;font-family:Consolas,"Liberation Mono",Menlo,monospace;font-size:12px;line-height:1.7;color:#15386b}
code{font-family:Consolas,"Liberation Mono",Menlo,monospace;background:#edf3ff;color:#204a88;border-radius:4px;padding:2px 4px;font-size:.9em;overflow-wrap:anywhere}
pre code{background:none;color:inherit;padding:0;font-size:inherit}
.substep{margin-top:24px}
.substep h3{font-size:17px;letter-spacing:-.02em;margin-bottom:9px;line-height:1.35}
.substep>p{font-size:14px;color:var(--muted)}
.substep .tiny{font-size:12px;margin-top:8px}
.package-choice{display:flex;gap:7px;margin:12px 0 3px;flex-wrap:wrap}
.package-choice button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 11px;color:var(--muted);font-size:11px;font-weight:700}
.package-choice button[aria-pressed="true"]{border-color:var(--blue);color:var(--blue);background:var(--pale)}
.prompt-box{margin-top:13px}
.prompt-box pre{font-family:Arial,Helvetica,sans-serif;font-size:14px;line-height:1.75;color:var(--ink);padding:18px 19px;white-space:pre-wrap}
.result-box{border:1px solid #bfd4fd;border-radius:12px;padding:16px 18px;background:white;margin-top:17px}
.result-box h4{font-size:13px;color:var(--blue);margin-bottom:8px}
.result-box p{font-size:13px;color:var(--muted)}
.microflow{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:18px}
.microflow div{border:1px solid var(--line);border-radius:9px;padding:11px 10px;font-size:11px;color:var(--muted);line-height:1.5;background:white}
.microflow b{display:block;font-size:13px;color:var(--blue);margin-bottom:3px}
.check-box{border:1px solid #b8ceff;border-radius:var(--radius);background:white;overflow:hidden}
.check-top{padding:19px 22px;background:var(--pale);border-bottom:1px solid var(--line)}
.check-top-row{display:flex;align-items:center;justify-content:space-between;gap:13px}
.check-top h3{font-size:17px;line-height:1.3}
.count{font-size:14px;color:var(--blue);font-weight:700;white-space:nowrap}
.meter{background:#dbe6ff;height:4px;border-radius:3px;margin-top:14px;overflow:hidden}
.meter div{height:100%;background:var(--blue);width:0;transition:width .2s}
.checks{padding:5px 21px}
.check-row{display:flex;gap:12px;align-items:flex-start;cursor:pointer;padding:14px 0;border-bottom:1px solid #edf1f8;font-size:13px;line-height:1.6}
.check-row:last-child{border:0}
.check-row input{margin:4px 0 0;flex:0 0 17px;width:17px;height:17px;accent-color:var(--blue);cursor:pointer}
.check-row input:checked+span{color:var(--green)}
.check-bottom{padding:15px 21px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-start;gap:20px}
.check-bottom p{font-size:11px;color:var(--muted);max-width:520px}
.reset{padding:2px 0;border:0;background:none;color:var(--blue);font-size:11px;font-weight:700;white-space:nowrap}
.complete{margin-top:14px;padding:15px 18px;color:var(--green);background:var(--green-pale);border:1px solid #bdddc9;border-radius:11px;font-size:13px}
.helper-head{font-size:18px;margin-top:26px;letter-spacing:-.02em}
.sources{margin-top:26px}
.source-links{display:grid;grid-template-columns:1fr 1fr;gap:10px 20px}
.source-links a{font-size:12px;line-height:1.5;text-decoration:none}
.source-links a:hover{text-decoration:underline}
.source-meta{margin-top:15px!important;font-size:11px}
footer{border-top:1px solid var(--line);padding:24px 0 30px;background:white}
.footer-row{display:flex;align-items:center;justify-content:space-between;gap:25px;font-size:11px;color:var(--muted)}
.footer-row strong{color:var(--ink);font-size:12px}
.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:var(--ink);color:white;font-size:13px;padding:10px 18px;border-radius:10px;z-index:15;box-shadow:0 5px 20px #08112e22;max-width:90vw;text-align:center}
.skip{position:fixed;top:-80px;left:20px;z-index:20;background:white;padding:10px}
.skip:focus{top:10px}
.noscript{margin:30px;padding:25px;border:2px solid var(--blue);font-size:16px}
[hidden]{display:none!important}

/* Readable instruction cards */
.install-box{background:#eaf0fa;border-color:#afc3e6}
.install-header,.check-top{background:#dce7fa}
.install-steps li{border-bottom-color:#c5d3e9}
.install-steps p,.substep>p,.rule-card p,.details-body,.result-box p,.check-row{font-weight:600}
.install-steps h4,.substep h3{font-weight:800}
.rule-card,.result-box,.tool,.microflow div,details{background:#eaf0fa;border-color:#bdcce4}
.substep{padding:20px 22px;background:#eaf0fa;border:1px solid #bdcce4;border-radius:14px;margin-top:16px}
.permission-card{background:#dfe9fb;border-color:#9fb9e8;border-left:4px solid var(--blue)}
.note.soft{background:#e8edf5;border-left-color:#99adc9;color:#34415a}
.access{background:#dde7f6;font-weight:600}
.cmd{background:#dfe9fa;border-color:#adbfde}
.cmd-bar{background:#cfddf4;border-bottom-color:#adbfde;padding:12px 16px}
.cmd-label{font-size:11px;color:#263c62;font-weight:800}
.copy{font-size:12px;padding:6px 12px;border:1px solid #b0c4e7}
.prompt-box pre{font-size:15px;font-weight:600;background:#e8effc;line-height:1.8}
.check-box{background:#edf2fa}
.check-row{border-bottom-color:#c8d5e8}
.agent p,.lede,.section-head p{font-weight:600}
strong{font-weight:800}

<script>"use strict";
const T={"en":{"title":"Your own","accent":"Dataset Explorer.","eyebrow":"AI/ML FUNDAMENTALS / BUILD WITH YOUR AGENT","lede":"Build a small app that opens a CSV, shows missing values and creates a chart. Choose your colors and add one useful idea.","heroNote":"One project. One agent. A result you can use in your next lessons.","previewLabel":"EXAMPLE FROM THE TEST CSV","previewRows":"Rows","previewColumns":"Columns","previewMissing":"Missing","previewChart":"Sum of value by category","previewNote":"Your app will calculate these numbers from a real file.","route":"YOUR ROUTE","nav":["Get ready","Your choices","Build the basics","Add a chart","Make it yours","Check the result","Save & show"],"stack":"One stack for everyone","stackNote":"Python + Streamlit + pandas. Small local CSV files. No graphics card needed.","print":"Print guide","copy":"Copy prompt","copied":"Copied","copyFail":"Text selected. Copy it manually.","skip":"Skip to steps","progress":"Your progress","progressNote":"Tick a step after you have checked the result yourself.","localNote":"Choices and checkmarks are saved in this browser when storage is available.","howTitle":"How to use this guide","howText":"Open your project in your installed coding agent. Send one prompt at a time. After each step, open the app and check what changed. Stay in the same project and chat.","stageTitles":["Get your project ready","Choose what makes it yours","Build the first working version","Add one useful chart","Add your colors and idea","Check with known answers","Save it and show your result"],"stageSubs":["The agent checks the environment and prepares your folder.","Fill in four choices. They will appear in the prompts below.","Upload a CSV and see what is inside it.","Choose two columns and ask a clear question.","Change the design and add one small feature.","Use a small file where you can check every number.","Keep a version that you can start again."],"prepareSteps":["Use the agent you already installed: Antigravity, Codex or Claude Code.","Open a separate project folder, for example Documents/AI_ML/Dataset_Explorer. Keep using that folder.","If the agent is not installed yet, use the setup guide from your mentor first."],"prepareTip":"The agent runs project commands. You open the local app link and check the result. If your computer needs confirmation, complete it and tell the agent.","promptLabels":["01 / CHECK THE PROJECT","03 / BUILD THE BASICS","04 / ADD A CHART","05 / YOUR DESIGN + ONE FEATURE","06 / CHECK THE APP","07 / SAVE A WORKING VERSION","HELP / FIX ONE PROBLEM","LATER / START MY APP"],"readyTitles":["Before you continue","Your choices are ready","Open the app and look for","Check one number","Your own contribution","Compare these results","Show your mentor"],"readyTexts":["The agent gives the project folder, the Python environment and the result of real import checks. If something is blocked, show your mentor the message.","Choose any name and colors. Start with one extra feature; you can change your choice later.","An upload button, a preview table, row and column counts, missing values by column and a count of extra identical rows.","Use the test CSV below: A must total 30 and B must total 10. Check the chart labels and the numbers under it.","Show one visible design change and demonstrate your extra feature. The original counts must still be correct.","Upload the test files into your own app. A checkmark here means you observed the result yourself.","Open the app, load a CSV, explain one number and demonstrate your own feature. Show where the project is saved."],"fieldName":"App name","fieldAccent":"Main color","fieldBackground":"Background","fieldExtra":"One extra feature","fieldCustom":"Describe your own feature","customPlaceholder":"One small action that helps you work with the data","fieldsHint":"These settings change your app brief, not the colors of this guide.","previewTitle":"Your choices","previewExtra":"Your extra feature","profileSaved":"Your choices are used in the prompts below.","featureLabels":["Show rows with missing values","Download a data-check report","Search the table","Show unique values per column","My own idea"],"featureSpecs":["Add a button that shows rows containing at least one missing value.","Add a button to download a CSV report with missing counts and percentages for every column.","Add a search box for the preview table. Keep all summary numbers and the chart based on the full file and label this clearly.","Show the number of different non-missing values in each column.","Add my own small feature."],"coreCards":[["Open","CSV with a header; comma or semicolon; up to 5 MB."],["Explore","First 100 rows, row and column counts, and column types."],["Notice","Missing counts and percentages per column; extra identical rows."],["Keep","The source file stays unchanged. No automatic cleaning."]],"fullFile":"The preview shows the first 100 rows. All counts and chart calculations use the full file.","chartCards":[["Category","A column with group names, for example Category."],["Number","A numeric column to add up, for example Sales."]],"chartTip":"Ask: “What is the total for each category?” The chart shows totals. It does not explain why they differ.","ruleTitle":"Three things to remember","rules":[["Missing is not zero","An empty value does not tell us that the value is 0."],["A repeated row needs a check","A repeated record may be valid. Inspect it before deleting anything."],["A number may be an ID","A numeric type does not always mean that adding the values makes sense."]],"testTitle":"A tiny CSV with known answers","testIntro":"Download this file and upload it into your app. You can also read all five rows here.","downloadCsv":"Download test CSV","downloadText":"Download text-only CSV","downloadInvalid":"Download wrong-format file","downloadEmpty":"Download empty CSV","csvLabel":"CHECK_DATASET.CSV","expectedHeaders":["What to check","Expected result"],"expectedRows":[["Rows / columns","5 / 2"],["Missing values in value","1 out of 5 = 20%"],["Extra identical rows","1"],["Sum for A / B","30 / 10"]],"testNote":"The two B,5 rows create one extra identical row. “20%” refers to the value column, not all cells in the table.","edgeTests":[["Text-only CSV","The table and counts still work. The app explains why a numeric chart is unavailable."],["Wrong-format file","The app refuses the file with a simple message. It does not crash."],["Empty CSV","The app asks for a file with a header and data."]],"extraTestsTitle":"Check two more situations","emptyOptional":"Also try an empty file","testActions":"Download these small files for your checks:","saveFiles":[["app.py","Your app."],["requirements.txt","The libraries used by the app."],["README.md","How to start it again."],["checks.txt","The checks that actually ran and your manual observations."]],"saveTip":"Keep the whole project folder. If Git is already set up for this project, ask the agent to save a local commit. You do not need to publish the app.","laterTitle":"To start the app another day","demoTitle":"Explain your result","demoQuestions":["What does one row in your CSV mean?","How did you check one number?","What did you change after the first version?"],"checkLabels":["My agent checked the project environment.","I chose my app name, colors and extra feature.","I opened the app and checked the basic counts.","My chart and its totals match the source data.","My design and extra feature work.","I tested the known answers and the other file types.","My working version and restart instructions are saved."],"complete":"Your self-check is complete. Show your running app and explain one result.","reset":"Reset checkmarks","resetConfirm":"Reset all seven checkmarks? Your app choices will stay.","helpTitle":"If you get stuck","helpSub":"Send the exact error to the same agent. Change one thing, then check again.","helpFields":["What I tried","What I expected","What happened / full error"],"helpPlaceholder":"Describe the problem before copying the help prompt.","helpItems":[["The agent says “done”, but I cannot see the app","Ask it to start the app, give the exact local link and check that the server responds. Then open the link yourself."],["Python or a library is missing","Ask the same agent to check the project environment. If setup is blocked, show your mentor the message."],["The numbers are wrong","Use the five-row test CSV. Compare the actual and expected answers before changing the design."]],"sourceTitle":"Useful official references","sourceNote":"This guide builds a small data tool. pandas calculates the results; your agent helps create and change the code.","sourceLabels":["Streamlit · install and run","Streamlit · upload a file","Streamlit · bar chart","pandas · missing values"],"footerLeft":"AI/ML Fundamentals · Cohort 2","footerRight":"One HTML file · ENG / RU / UZB · read offline","offline":"Reading, copying prompts and downloading the test files work offline. Your cloud coding agent needs internet.","promptSetup":"Check this local project folder for my Dataset Explorer. I am a beginner: run the project checks yourself.\n\n1. Confirm the actual folder and inspect existing files. Reuse working Python and the project .venv from my previous setup. If Python is missing or incompatible, explain the blocker clearly. Do not replace a working setup just to change its version.\n2. Check imports for streamlit and pandas using the project interpreter. Install only missing project packages into .venv. Preserve existing work.\n3. Report the actual interpreter, versions and check results. Explain one action I need to take only if something is really blocked.\n\nDo not build the app yet. Do not publish anything. Mark checks you could not run as NOT CHECKED.","promptCore":"Build the first working version of my Dataset Explorer in this project.\nApp name: {name}\n\nUse the existing Python environment, Streamlit and pandas. Use simple English in the app. Run the commands yourself.\n\nAdd:\n- CSV upload with a header, UTF-8 encoding, and a choice of comma or semicolon separator. Limit each file to 5 MB.\n- Row count, column count and a preview of the first 100 rows.\n- A table of column names and pandas types.\n- Missing count and percentage for each column. Explain the missing-value rules used when reading the CSV.\n- A count of extra exact duplicate rows, excluding the first occurrence.\n- Clear messages for an empty file, a wrong file type and a file that cannot be read.\n\nUse the full file for all counts. Keep the source data unchanged. Do not add automatic cleaning or a chart yet.\n\nCreate or update app.py, requirements.txt and a short README.md. Preserve existing project work.\n\nStart the app using this project environment. Give me its exact local URL and check that the server responds. Say separately whether you could inspect the page in a browser. Tell me what I should check myself.","promptChart":"Add one chart to my existing app using Streamlit's built-in bar chart. Keep the other features working.\n\nLet me select a category column and a numeric column. Show the sum of the numeric values for each category. Use the full uploaded file for the calculation. Show the exact totals in a small table below the chart. Label both axes and the aggregation clearly.\n\nShow up to 20 categories, sorted by total. State clearly when the chart shows only the top 20. Keep all category totals in the table.\n\nDo not replace missing numbers with zero. If all numbers in a group are missing, show No data. Report rows with a missing category separately. If there are no usable numeric columns, keep the overview working and explain why the chart is unavailable.\n\nUse the test file when checking: A must total 30 and B must total 10. I will provide check_dataset.csv in the project folder if you cannot access it. Do not claim to have read a file that is not available. Run the app and report the actual checks.","promptStyle":"Update the existing app using my choices:\nApp name: {name}\nMain color: {accent}\nBackground color: {background}\nOne extra feature: {feature}\n\nUse a simple, readable layout and the existing stack: Python, Streamlit and pandas. Implement only this one extra feature. Keep the original data unchanged and keep all existing counts and chart calculations correct.\n\nRun the app again. Explain what changed and how I can check the extra feature. If you cannot inspect its appearance, say so and give me a short visual checklist.","promptTest":"Help me verify my existing app.\n\nUse this test CSV:\ncategory,value\nA,10\nA,20\nB,\nB,5\nB,5\n\nExpected: 5 rows, 2 columns, 1 missing value in value (20% of that column), 1 extra exact duplicate row, A total 30 and B total 10.\n\nAlso check a CSV with text columns only, an empty CSV, a wrong-format file and a group where all numeric values are missing. The app must give clear messages; an all-missing group must not become a known zero.\n\nRun the checks you can actually run. For browser interactions you cannot perform, give me short manual steps and mark them NOT CHECKED. A server response alone does not verify the page.\n\nSave actual results in checks.txt: expected result, observed result and status. Keep automated and manual checks separate. If a check fails, fix the specific problem and rerun the affected checks. Preserve my design and source data.","promptSave":"Save a working version of this Dataset Explorer project.\n\n1. Make sure the latest app starts using the project environment.\n2. Keep app.py and requirements.txt up to date. Keep any theme or support files the app uses.\n3. Write a short README.md with the actual setup and restart commands for this computer. Record the Python and package versions that were checked.\n4. Keep checks.txt honest: include actual results and clearly label anything not checked. Do not claim I completed a manual check unless I told you its result.\n5. If this project already uses Git, save a local commit of the project files. Otherwise keep the working files in this folder. Do not publish or push.\n\nFinish with the project path, the local app URL, the files I should keep and one sentence I can use to ask you to start the app later.","promptHelp":"Help me fix one problem in this existing Dataset Explorer.\n\nWhat I tried: {tried}\nWhat I expected: {expected}\nWhat happened / full error: {error}\n\nInspect the relevant project files and the real error. Find the cause, make a small fix and rerun the affected check. Preserve the other working features and my source data. Tell me what you actually verified. Mark anything you could not verify as NOT CHECKED.","promptLater":"Open this saved Dataset Explorer project. Use its existing Python environment and README.md to start the app. Run it yourself and give me the exact local URL. If something fails, fix the startup problem and report what you actually checked."},"ru":{"title":"Твой собственный","accent":"Dataset Explorer.","eyebrow":"AI/ML FUNDAMENTALS / СОЗДАЁМ С АГЕНТОМ","lede":"Собери небольшое приложение: открой CSV, найди пропуски и построй график. Выбери свои цвета и добавь одну полезную идею.","heroNote":"Один проект. Один агент. Инструмент для следующих занятий.","previewLabel":"ПРИМЕР ИЗ ПРОВЕРОЧНОГО CSV","previewRows":"Строки","previewColumns":"Столбцы","previewMissing":"Пропуски","previewChart":"Сумма value по category","previewNote":"Твоё приложение посчитает эти числа по настоящему файлу.","route":"ТВОЙ МАРШРУТ","nav":["Подготовка","Твои идеи","Основа","График","Твой стиль","Проверка","Сохранение"],"stack":"Общий стек для всех","stackNote":"Python + Streamlit + pandas. Небольшие локальные CSV. Видеокарта не нужна.","print":"Печать","copy":"Копировать промпт","copied":"Скопировано","copyFail":"Текст выделен. Скопируй его вручную.","skip":"Перейти к этапам","progress":"Твой прогресс","progressNote":"Отмечай этап, когда сам проверил результат.","localNote":"Выбор и отметки сохраняются в этом браузере, если доступно хранилище.","howTitle":"Как пользоваться","howText":"Открой проект в установленном агенте. Отправляй по одному промпту. После каждого этапа открывай приложение и проверяй изменения. Продолжай в том же проекте и чате.","stageTitles":["Подготовь учебный проект","Выбери, каким будет приложение","Собери первую рабочую версию","Добавь один полезный график","Добавь свои цвета и идею","Проверь на известных ответах","Сохрани и покажи результат"],"stageSubs":["Агент проверит среду и подготовит папку.","Заполни четыре пункта. Они появятся в промптах ниже.","Загрузи CSV и посмотри, что в нём.","Выбери два столбца и задай понятный вопрос.","Поменяй оформление и добавь одну небольшую функцию.","Возьми маленький файл, где можно проверить каждое число.","Сохрани версию, которую сможешь запустить снова."],"prepareSteps":["Используй уже установленного агента: Antigravity, Codex или Claude Code.","Открой отдельную папку проекта, например Documents/AI_ML/Dataset_Explorer. Продолжай работать в ней.","Если агент ещё не установлен, сначала пройди памятку по установке от наставника."],"prepareTip":"Команды проекта выполняет агент. Ты открываешь локальную ссылку и проверяешь результат. Если компьютер просит подтверждение, выполни его и сообщи агенту.","promptLabels":["01 / ПРОВЕРЬ ПРОЕКТ","03 / СОБЕРИ ОСНОВУ","04 / ДОБАВЬ ГРАФИК","05 / ТВОЙ ДИЗАЙН + ОДНА ФУНКЦИЯ","06 / ПРОВЕРЬ ПРИЛОЖЕНИЕ","07 / СОХРАНИ РАБОЧУЮ ВЕРСИЮ","ПОМОЩЬ / ИСПРАВЬ ОДНУ ПРОБЛЕМУ","ПОЗЖЕ / ЗАПУСТИ МОЁ ПРИЛОЖЕНИЕ"],"readyTitles":["Перед следующим шагом","Твой выбор готов","Открой приложение и найди","Проверь одно число","Твой личный вклад","Сравни результаты","Покажи наставнику"],"readyTexts":["Агент назвал папку проекта, среду Python и результат фактических проверок импортов. Если есть блокировка, покажи сообщение наставнику.","Название и цвета выбираешь ты. Начни с одной дополнительной функции; позже выбор можно поменять.","Кнопку загрузки, таблицу, число строк и столбцов, пропуски по столбцам и количество лишних одинаковых строк.","В проверочном CSV ниже сумма для A должна быть 30, для B — 10. Посмотри подписи и числа под графиком.","Покажи одно заметное изменение дизайна и свою дополнительную функцию. Исходные числа должны остаться верными.","Загрузи проверочные файлы в своё приложение. Галочка в этой памятке означает, что ты сам увидел результат.","Открой приложение, загрузи CSV, объясни одно число и покажи свою функцию. Покажи, где сохранён проект."],"fieldName":"Название приложения","fieldAccent":"Основной цвет","fieldBackground":"Фон","fieldExtra":"Одна дополнительная функция","fieldCustom":"Опиши свою функцию","customPlaceholder":"Одно небольшое действие, полезное для работы с данными","fieldsHint":"Эти настройки меняют задание для твоего приложения, а не цвета памятки.","previewTitle":"Твой выбор","previewExtra":"Твоя функция","profileSaved":"Твой выбор подставляется в промпты ниже.","featureLabels":["Показать строки с пропусками","Скачать отчёт о данных","Поиск по таблице","Число уникальных значений","Своя идея"],"featureSpecs":["Добавь кнопку, которая показывает строки хотя бы с одним пропуском.","Добавь скачивание CSV-отчёта с числом и долей пропусков для каждого столбца.","Добавь поиск по таблице предпросмотра. Все показатели и график продолжай считать по полному файлу и явно подпиши это.","Покажи число разных непустых значений в каждом столбце.","Добавь мою небольшую функцию."],"coreCards":[["Открыть","CSV с заголовком, запятой или точкой с запятой; до 5 МБ."],["Посмотреть","Первые 100 строк, число строк и столбцов, типы столбцов."],["Заметить","Число и долю пропусков; лишние одинаковые строки."],["Сохранить данные","Исходный файл не меняется. Автоматической очистки нет."]],"fullFile":"Таблица показывает первые 100 строк. Все показатели и график рассчитываются по полному файлу.","chartCards":[["Категория","Столбец с названиями групп, например Category."],["Число","Числовой столбец для суммы, например Sales."]],"chartTip":"Вопрос: «Какая сумма у каждой категории?» График показывает суммы. Причины различий он не объясняет.","ruleTitle":"Три вещи, о которых стоит помнить","rules":[["Пропуск — не ноль","Пустое значение не означает, что там было 0."],["Повтор нужно проверить","Одинаковая запись может быть допустимой. Сначала посмотри на неё."],["Число может быть ID","Числовой тип ещё не означает, что значения разумно складывать."]],"testTitle":"Маленький CSV с известными ответами","testIntro":"Скачай файл и загрузи в своё приложение. Все пять строк можно прочитать и здесь.","downloadCsv":"Скачать проверочный CSV","downloadText":"Скачать CSV только с текстом","downloadInvalid":"Скачать файл другого формата","downloadEmpty":"Скачать пустой CSV","csvLabel":"CHECK_DATASET.CSV","expectedHeaders":["Что проверить","Ожидаемый результат"],"expectedRows":[["Строки / столбцы","5 / 2"],["Пропуски в value","1 из 5 = 20%"],["Лишние одинаковые строки","1"],["Сумма для A / B","30 / 10"]],"testNote":"Две строки B,5 дают одну лишнюю одинаковую строку. 20% относится к столбцу value, а не ко всем ячейкам таблицы.","edgeTests":[["CSV только с текстом","Таблица и показатели работают. Приложение объясняет, почему числовой график недоступен."],["Файл другого формата","Приложение понятно отказывает в загрузке и продолжает работать."],["Пустой CSV","Приложение просит файл с заголовком и данными."]],"extraTestsTitle":"Проверь ещё две ситуации","emptyOptional":"Попробуй и пустой файл","testActions":"Скачай эти маленькие файлы для проверки:","saveFiles":[["app.py","Твоё приложение."],["requirements.txt","Библиотеки, которые использует приложение."],["README.md","Как запустить его снова."],["checks.txt","Реально выполненные проверки и твои наблюдения."]],"saveTip":"Сохрани всю папку проекта. Если Git уже настроен для этого проекта, попроси агента сохранить локальный коммит. Публикация приложения не требуется.","laterTitle":"Чтобы запустить в другой день","demoTitle":"Объясни результат","demoQuestions":["Что означает одна строка в твоём CSV?","Как ты проверил одно число?","Что ты изменил после первой версии?"],"checkLabels":["Агент проверил среду проекта.","Я выбрал название, цвета и дополнительную функцию.","Я открыл приложение и проверил основные числа.","График и суммы совпадают с исходными данными.","Моё оформление и дополнительная функция работают.","Я проверил известные ответы и другие типы файлов.","Рабочая версия и инструкция повторного запуска сохранены."],"complete":"Самопроверка завершена. Покажи работающее приложение и объясни один результат.","reset":"Сбросить отметки","resetConfirm":"Сбросить все семь отметок? Твой выбор оформления останется.","helpTitle":"Если что-то не получается","helpSub":"Отправь точную ошибку тому же агенту. Меняй по одной вещи, затем проверяй снова.","helpFields":["Что я сделал","Что ожидал увидеть","Что произошло / полный текст ошибки"],"helpPlaceholder":"Опиши проблему перед копированием промпта помощи.","helpItems":[["Агент написал «готово», но приложение не открывается","Попроси запустить приложение, дать точную локальную ссылку и проверить ответ сервера. Затем открой ссылку сам."],["Не найден Python или библиотека","Попроси того же агента проверить среду проекта. Если настройка заблокирована, покажи сообщение наставнику."],["Не сходятся числа","Возьми проверочный CSV из пяти строк. Сравни фактический и ожидаемый ответы перед правкой оформления."]],"sourceTitle":"Полезные официальные справки","sourceNote":"Этот проект — небольшой инструмент для данных. pandas выполняет расчёты; агент помогает создавать и менять код.","sourceLabels":["Streamlit · установка и запуск","Streamlit · загрузка файла","Streamlit · столбчатый график","pandas · пропуски"],"footerLeft":"AI/ML Fundamentals · Поток 2","footerRight":"Один HTML · ENG / RU / UZB · чтение без интернета","offline":"Читать, копировать промпты и скачивать проверочные файлы можно без интернета. Облачному агенту нужен интернет.","promptSetup":"Проверь эту локальную папку проекта для моего Dataset Explorer. Я начинающий: выполни проверки проекта самостоятельно.\n\n1. Назови фактическую папку и посмотри существующие файлы. Переиспользуй рабочий Python и среду .venv из предыдущей настройки. Если Python отсутствует или несовместим, понятно объясни препятствие. Не меняй рабочую среду только ради другой версии.\n2. Проверь импорты streamlit и pandas интерпретатором проекта. Установи в .venv только недостающие библиотеки проекта. Сохрани существующие работы.\n3. Сообщи фактический интерпретатор, версии и результаты проверок. Назови необходимое действие с моей стороны, только если есть реальное препятствие.\n\nПока не создавай приложение. Ничего не публикуй. Невыполненные проверки пометь НЕ ПРОВЕРЕНО.","promptCore":"Собери первую рабочую версию Dataset Explorer в этом проекте.\nНазвание: {name}\n\nИспользуй существующую среду Python, Streamlit и pandas. Интерфейс приложения — на простом английском. Команды выполняй самостоятельно.\n\nДобавь:\n- Загрузку CSV с заголовком, кодировкой UTF-8 и выбором разделителя: запятая или точка с запятой. Не более 5 МБ на файл.\n- Число строк, число столбцов и первые 100 строк.\n- Таблицу названий столбцов и типов pandas.\n- Число и долю пропусков для каждого столбца. Объясни, что считается пропуском при чтении CSV.\n- Число лишних полностью одинаковых строк, без первого вхождения.\n- Понятные сообщения для пустого файла, неверного формата и файла, который не удаётся прочитать.\n\nВсе показатели считай по полному файлу. Исходные данные не меняй. Пока не добавляй автоматическую очистку и график.\n\nСоздай или обнови app.py, requirements.txt и короткий README.md. Сохрани имеющиеся работы проекта.\n\nЗапусти приложение из среды этого проекта. Дай точный локальный адрес и проверь ответ сервера. Отдельно скажи, удалось ли посмотреть страницу в браузере. Назови, что мне проверить самому.","promptChart":"Добавь один график в существующее приложение через встроенный столбчатый график Streamlit. Сохрани работающими остальные функции.\n\nДай выбрать категориальный и числовой столбцы. Покажи сумму числовых значений по каждой категории. Расчёт выполняй по полному загруженному файлу. Точные суммы покажи небольшой таблицей под графиком. Явно подпиши оси и способ расчёта.\n\nПокажи до 20 категорий, отсортированных по сумме. Если видны только первые 20, прямо напиши это. В таблице оставь суммы всех категорий.\n\nНе подменяй пропуски нулями. Если в группе все числа пропущены, покажи No data. Отдельно сообщи о строках без категории. Если подходящих числовых столбцов нет, сохрани обзор данных и объясни, почему график недоступен.\n\nПри проверке используй проверочный CSV: сумма A = 30, B = 10. Если файл тебе недоступен, я помещу check_dataset.csv в папку проекта. Не заявляй о чтении недоступного файла. Запусти приложение и сообщи фактические результаты проверок.","promptStyle":"Обнови существующее приложение по моему выбору:\nНазвание: {name}\nОсновной цвет: {accent}\nЦвет фона: {background}\nОдна дополнительная функция: {feature}\n\nИспользуй простой читаемый интерфейс и прежний стек: Python, Streamlit и pandas. Реализуй только эту одну дополнительную функцию. Исходные данные не меняй; все прежние показатели и расчёты графика должны остаться верными.\n\nСнова запусти приложение. Объясни, что изменилось и как проверить новую функцию. Если не можешь посмотреть оформление, прямо скажи это и дай короткий список визуальных проверок.","promptTest":"Помоги проверить моё существующее приложение.\n\nИспользуй этот CSV:\ncategory,value\nA,10\nA,20\nB,\nB,5\nB,5\n\nОжидается: 5 строк, 2 столбца, 1 пропуск в value (20% столбца), 1 лишняя полностью одинаковая строка, сумма A = 30 и B = 10.\n\nТакже проверь CSV только с текстовыми столбцами, пустой CSV, файл другого формата и группу, где все числовые значения пропущены. Приложение должно давать понятные сообщения; группа без чисел не должна превращаться в известный ноль.\n\nРеально выполни доступные тебе проверки. Для действий в браузере, которые не можешь выполнить, дай короткие ручные шаги и пометь НЕ ПРОВЕРЕНО. Один ответ сервера не подтверждает страницу.\n\nСохрани фактические результаты в checks.txt: ожидаемый результат, наблюдаемый результат и статус. Отделяй автоматические проверки от ручных. При ошибке исправь конкретную причину и повтори затронутые проверки. Сохрани мой дизайн и исходные данные.","promptSave":"Сохрани рабочую версию этого проекта Dataset Explorer.\n\n1. Убедись, что актуальное приложение запускается из среды проекта.\n2. Обнови app.py и requirements.txt. Сохрани файлы темы и другие файлы, нужные приложению.\n3. Сделай короткий README.md с фактическими командами настройки и повторного запуска для этого компьютера. Укажи проверенные версии Python и библиотек.\n4. В checks.txt оставь реальные результаты и явно пометь непроверенное. Не утверждай, что я выполнил ручную проверку, пока я не сообщил её результат.\n5. Если проект уже использует Git, сохрани локальный коммит файлов проекта. Иначе сохрани рабочие файлы в этой папке. Не публикуй и не отправляй изменения на сервер.\n\nВ конце дай путь проекта, локальную ссылку, список нужных файлов и одну фразу, которой я смогу попросить запустить приложение позже.","promptHelp":"Помоги исправить одну проблему в существующем Dataset Explorer.\n\nЧто я сделал: {tried}\nЧто ожидал увидеть: {expected}\nЧто произошло / полный текст ошибки: {error}\n\nПосмотри нужные файлы проекта и реальную ошибку. Найди причину, внеси небольшое исправление и повтори затронутую проверку. Сохрани остальные работающие функции и исходные данные. Назови, что фактически проверено. Непроверенное пометь НЕ ПРОВЕРЕНО.","promptLater":"Открой этот сохранённый проект Dataset Explorer. Используй его существующую среду Python и README.md, чтобы запустить приложение. Выполни запуск самостоятельно и дай точную локальную ссылку. Если есть ошибка, исправь проблему запуска и сообщи, что реально проверено."},"uz":{"title":"O'zingning","accent":"Dataset Explorer.","eyebrow":"AI/ML ASOSLARI / AGENTING BILAN YARAT","lede":"CSV faylini ochadigan, bo'sh qiymatlarni ko'rsatadigan va grafik chizadigan kichik ilova yarat. Ranglaringni tanla va bitta foydali g'oya qo'sh.","heroNote":"Bitta loyiha. Bitta agent. Keyingi darslarda ishlatadigan vosita.","previewLabel":"TEKSHIRUV CSV FAYLIDAN MISOL","previewRows":"Qatorlar","previewColumns":"Ustunlar","previewMissing":"Bo'sh qiymatlar","previewChart":"category bo'yicha value yig'indisi","previewNote":"Ilovang bu sonlarni haqiqiy fayldan hisoblaydi.","route":"SENING YO'LING","nav":["Tayyorgarlik","Sening tanloving","Asosini yarat","Grafik qo'sh","O'zingga mosla","Natijani tekshir","Saqlab, ko'rsat"],"stack":"Hamma uchun bir xil vositalar","stackNote":"Python + Streamlit + pandas. Kichik mahalliy CSV fayllar. Videokarta kerak emas.","print":"Qo'llanmani chop et","copy":"Promptni nusxala","copied":"Nusxalandi","copyFail":"Matn belgilandi. Uni qo'lda nusxala.","skip":"Bosqichlarga o't","progress":"Sening yutuqlaring","progressNote":"Natijani o'zing tekshirgandan keyin bosqichni belgilab qo'y.","localNote":"Brauzerda saqlash imkoniyati bo'lsa, tanlovlaring va belgilaring shu brauzerda saqlanadi.","howTitle":"Qo'llanmadan qanday foydalanish kerak","howText":"Loyihangni o'rnatilgan dasturlash agentida och. Har safar bittadan prompt yubor. Har bir bosqichdan keyin ilovani ochib, nima o'zgarganini tekshir. Shu loyiha va shu chatda ishlashda davom et.","stageTitles":["Loyihangni tayyorla","Ilovang qanday bo'lishini tanla","Birinchi ishlaydigan versiyani yarat","Bitta foydali grafik qo'sh","Ranglaring va g'oyangni qo'sh","Ma'lum javoblar bilan tekshir","Saqlab, natijangni ko'rsat"],"stageSubs":["Agent muhitni tekshiradi va papkangni tayyorlaydi.","To'rtta bandni to'ldir. Ular pastdagi promptlarda paydo bo'ladi.","CSV yukla va ichidagi ma'lumotlarni ko'r.","Ikkita ustunni tanla va aniq savol ber.","Ko'rinishni o'zgartir va bitta kichik funksiya qo'sh.","Har bir sonini tekshira oladigan kichik fayldan foydalan.","Qayta ishga tushira oladigan versiyani saqla."],"prepareSteps":["O'rnatib bo'lgan agentingdan foydalan: Antigravity, Codex yoki Claude Code.","Loyiha uchun alohida papka och, masalan Documents/AI_ML/Dataset_Explorer. Shu papkada ishlashda davom et.","Agent hali o'rnatilmagan bo'lsa, avval ustozing bergan o'rnatish qo'llanmasidan foydalan."],"prepareTip":"Loyiha buyruqlarini agent bajaradi. Sen ilovaning mahalliy havolasini ochib, natijani tekshirasan. Kompyuter tasdiqlashni so'rasa, tasdiqla va agentga ayt.","promptLabels":["01 / LOYIHANI TEKSHIR","03 / ASOSINI YARAT","04 / GRAFIK QO'SH","05 / SENING DIZAYNING + BITTA FUNKSIYA","06 / ILOVANI TEKSHIR","07 / ISHLAYDIGAN VERSIYANI SAQLA","YORDAM / BITTA MUAMMONI TUZAT","KEYINROQ / ILOVAMNI ISHGA TUSHIR"],"readyTitles":["Davom etishdan oldin","Tanlovlaring tayyor","Ilovani och va quyidagilarni top","Bitta sonni tekshir","Sening hissang","Shu natijalarni solishtir","Ustozingga ko'rsat"],"readyTexts":["Agent loyiha papkasini, Python muhitini va amalda bajarilgan import tekshiruvlari natijasini ko'rsatadi. Biror to'siq bo'lsa, xabarni ustozingga ko'rsat.","Istalgan nom va ranglarni tanla. Bitta qo'shimcha funksiyadan boshla; tanlovingni keyin o'zgartirishing mumkin.","Fayl yuklash tugmasi, ko'rish jadvali, qatorlar va ustunlar soni, har bir ustundagi bo'sh qiymatlar va ortiqcha bir xil qatorlar soni.","Pastdagi tekshiruv CSV faylidan foydalan: A yig'indisi 30, B yig'indisi 10 bo'lishi kerak. Grafik yozuvlarini va tagidagi sonlarni tekshir.","Dizayndagi bitta ko'rinarli o'zgarishni ko'rsat va qo'shimcha funksiyangni ishlatib ko'rsat. Dastlabki hisoblar to'g'ri qolishi kerak.","Tekshiruv fayllarini ilovangga yukla. Bu yerdagi belgi natijani o'zing ko'rganingni bildiradi.","Ilovani och, CSV yukla, bitta sonni tushuntir va o'zing qo'shgan funksiyani ishlatib ko'rsat. Loyiha qayerda saqlanganini ko'rsat."],"fieldName":"Ilova nomi","fieldAccent":"Asosiy rang","fieldBackground":"Fon","fieldExtra":"Bitta qo'shimcha funksiya","fieldCustom":"O'z funksiyangni tasvirla","customPlaceholder":"Ma'lumot bilan ishlashga yordam beradigan bitta kichik amal","fieldsHint":"Bu sozlamalar qo'llanma ranglarini emas, ilovang uchun topshiriqni o'zgartiradi.","previewTitle":"Sening tanlovlaring","previewExtra":"Sening qo'shimcha funksiyang","profileSaved":"Tanlovlaring pastdagi promptlarda ishlatiladi.","featureLabels":["Bo'sh qiymatli qatorlarni ko'rsat","Ma'lumot tekshiruvi hisobotini yuklab ol","Jadvaldan qidir","Har bir ustundagi noyob qiymatlarni ko'rsat","O'z g'oyam"],"featureSpecs":["Kamida bitta bo'sh qiymati bor qatorlarni ko'rsatadigan tugma qo'sh.","Har bir ustundagi bo'sh qiymatlar soni va foizi yozilgan CSV hisobotni yuklab olish tugmasini qo'sh.","Ko'rish jadvali uchun qidiruv maydonini qo'sh. Barcha umumiy hisoblar va grafik to'liq fayl bo'yicha hisoblanishda davom etsin. Buni aniq yozib qo'y.","Har bir ustundagi bir-biridan farq qiladigan, bo'sh bo'lmagan qiymatlar sonini ko'rsat.","Mening kichik funksiyamni qo'sh."],"coreCards":[["Och","Sarlavhali CSV; ajratgich vergul yoki nuqtali vergul; hajmi 5 MB gacha."],["Ko'rib chiq","Dastlabki 100 qator, qatorlar va ustunlar soni hamda ustun turlari."],["E'tibor ber","Har bir ustundagi bo'sh qiymatlar soni va foizi; ortiqcha bir xil qatorlar."],["Aslini saqla","Asl fayl o'zgarmaydi. Avtomatik tozalash yo'q."]],"fullFile":"Jadval dastlabki 100 qatorni ko'rsatadi. Barcha hisoblar va grafik hisob-kitoblari to'liq fayl bo'yicha bajariladi.","chartCards":[["Kategoriya","Guruh nomlari yozilgan ustun, masalan Category."],["Son","Qiymatlarini qo'shish uchun sonli ustun, masalan Sales."]],"chartTip":"Savol ber: «Har bir kategoriya uchun yig'indi qancha?» Grafik yig'indilarni ko'rsatadi. Nega ular farq qilishini tushuntirmaydi.","ruleTitle":"Esda tutish kerak bo'lgan uchta narsa","rules":[["Bo'sh qiymat nol emas","Bo'sh qiymat uning o'rnida 0 bo'lganini bildirmaydi."],["Takrorlangan qatorni tekshirish kerak","Takrorlangan yozuv to'g'ri bo'lishi mumkin. Biror narsani o'chirishdan oldin uni tekshir."],["Son ID bo'lishi mumkin","Ustunning sonli turi qiymatlarni qo'shish har doim mantiqli ekanini bildirmaydi."]],"testTitle":"Javoblari ma'lum bo'lgan kichik CSV","testIntro":"Bu faylni yuklab olib, ilovangga yukla. Barcha beshta qatorni shu yerda ham o'qishing mumkin.","downloadCsv":"Tekshiruv CSV faylini yuklab ol","downloadText":"Faqat matnli CSV faylini yuklab ol","downloadInvalid":"Boshqa formatdagi faylni yuklab ol","downloadEmpty":"Bo'sh CSV faylini yuklab ol","csvLabel":"CHECK_DATASET.CSV","expectedHeaders":["Nimani tekshirish kerak","Kutilgan natija"],"expectedRows":[["Qatorlar / ustunlar","5 / 2"],["value ustunidagi bo'sh qiymatlar","5 tadan 1 ta = 20%"],["Ortiqcha bir xil qatorlar","1"],["A / B yig'indisi","30 / 10"]],"testNote":"Ikkita B,5 qatori bitta ortiqcha bir xil qatorni hosil qiladi. 20% butun jadval kataklariga emas, value ustuniga tegishli.","edgeTests":[["Faqat matnli CSV","Jadval va hisoblar ishlashda davom etadi. Ilova nega sonli grafikni ko'rsatib bo'lmasligini tushuntiradi."],["Boshqa formatdagi fayl","Ilova oddiy xabar bilan faylni qabul qilmaydi. Ishdan chiqmaydi."],["Bo'sh CSV","Ilova sarlavha va ma'lumotlari bor faylni so'raydi."]],"extraTestsTitle":"Yana ikkita holatni tekshir","emptyOptional":"Bo'sh faylni ham sinab ko'r","testActions":"Tekshirish uchun shu kichik fayllarni yuklab ol:","saveFiles":[["app.py","Sening ilovang."],["requirements.txt","Ilova ishlatadigan kutubxonalar."],["README.md","Ilovani qayta ishga tushirish yo'li."],["checks.txt","Amalda bajarilgan tekshiruvlar va qo'lda kuzatgan natijalaring."]],"saveTip":"Loyiha papkasini to'liq saqla. Loyiha uchun Git allaqachon sozlangan bo'lsa, agentdan mahalliy commit saqlashni so'ra. Ilovani internetga chiqarish shart emas.","laterTitle":"Ilovani boshqa kuni ishga tushirish uchun","demoTitle":"Natijangni tushuntir","demoQuestions":["CSV faylingdagi bitta qator nimani bildiradi?","Bitta sonni qanday tekshirding?","Birinchi versiyadan keyin nimani o'zgartirding?"],"checkLabels":["Agentim loyiha muhitini tekshirdi.","Ilovamning nomi, ranglari va qo'shimcha funksiyasini tanladim.","Ilovani ochib, asosiy hisoblarni tekshirdim.","Grafik va undagi yig'indilar asl ma'lumotlarga mos.","Dizaynim va qo'shimcha funksiyam ishlayapti.","Ma'lum javoblar va boshqa fayl turlarini tekshirdim.","Ishlaydigan versiya va qayta ishga tushirish yo'riqnomasi saqlangan."],"complete":"O'zingni tekshirish tugadi. Ishlayotgan ilovangni ko'rsat va bitta natijani tushuntir.","reset":"Belgilarni olib tashla","resetConfirm":"Yettita belgining hammasi olib tashlansinmi? Ilova uchun tanlovlaring saqlanadi.","helpTitle":"Biror joyda to'xtab qolsang","helpSub":"Aynan chiqqan xatoni shu agentga yubor. Bir safarda bitta narsani o'zgartir, keyin yana tekshir.","helpFields":["Nima qildim","Nima kutgandim","Nima bo'ldi / xatoning to'liq matni"],"helpPlaceholder":"Yordam promptini nusxalashdan oldin muammoni yoz.","helpItems":[["Agent «tayyor» dedi, lekin ilovani ko'ra olmayapman","Undan ilovani ishga tushirishni, aniq mahalliy havolani berishni va server javob berishini tekshirishni so'ra. Keyin havolani o'zing och."],["Python yoki kutubxona yo'q","Shu agentdan loyiha muhitini tekshirishni so'ra. Sozlashga to'siq bo'lsa, xabarni ustozingga ko'rsat."],["Sonlar noto'g'ri","Besh qatorli tekshiruv CSV faylidan foydalan. Dizaynni o'zgartirishdan oldin haqiqiy va kutilgan javoblarni solishtir."]],"sourceTitle":"Foydali rasmiy manbalar","sourceNote":"Bu qo'llanmada ma'lumot bilan ishlash uchun kichik vosita yaratasan. Natijalarni pandas hisoblaydi; agenting kod yaratish va o'zgartirishga yordam beradi.","sourceLabels":["Streamlit · o'rnatish va ishga tushirish","Streamlit · fayl yuklash","Streamlit · ustunli grafik","pandas · bo'sh qiymatlar"],"footerLeft":"AI/ML Fundamentals · 2-oqim","footerRight":"Bitta HTML fayl · ENG / RU / UZB · internetsiz o'qish","offline":"O'qish, promptlarni nusxalash va tekshiruv fayllarini yuklab olish internetsiz ishlaydi. Bulutdagi dasturlash agentingga internet kerak.","promptSetup":"Dataset Explorer uchun shu mahalliy loyiha papkasini tekshir. Men yangi boshlovchiman: loyiha tekshiruvlarini o'zing bajar.\n\n1. Amaldagi papkani aniq ko'rsat va mavjud fayllarni ko'rib chiq. Oldingi sozlashdan qolgan ishlaydigan Python va loyihaning .venv muhitidan foydalan. Python yo'q yoki mos kelmasa, to'siqni tushunarli tushuntir. Faqat versiyani o'zgartirish uchun ishlaydigan muhitni almashtirma.\n2. Loyiha interpretatori bilan streamlit va pandas importlarini tekshir. .venv ichiga faqat loyihaga yetishmayotgan paketlarni o'rnat. Mavjud ishlarni saqla.\n3. Haqiqiy interpretator, versiyalar va tekshiruv natijalarini ayt. Faqat haqiqiy to'siq bo'lsa, men bajarishim kerak bo'lgan bitta amalni tushuntir.\n\nHali ilovani yaratma. Hech narsani internetga chiqarma. Bajara olmagan tekshiruvlaringni TEKSHIRILMAGAN deb belgila.","promptCore":"Shu loyihada Dataset Explorer ilovamning birinchi ishlaydigan versiyasini yarat.\nIlova nomi: {name}\n\nMavjud Python muhiti, Streamlit va pandas ishlat. Ilovada sodda ingliz tilidan foydalan. Buyruqlarni o'zing bajar.\n\nQuyidagilarni qo'sh:\n- Sarlavhali, UTF-8 kodlashdagi CSV yuklash va ajratgichni tanlash: vergul yoki nuqtali vergul. Har bir fayl hajmi 5 MB dan oshmasin.\n- Qatorlar soni, ustunlar soni va dastlabki 100 qatorni ko'rish jadvali.\n- Ustun nomlari va pandas turlari jadvali.\n- Har bir ustundagi bo'sh qiymatlar soni va foizi. CSV o'qilganda nimalar bo'sh qiymat hisoblanishini tushuntir.\n- Birinchi uchrashini hisoblamay, ortiqcha to'liq bir xil qatorlar soni.\n- Bo'sh fayl, noto'g'ri fayl turi va o'qib bo'lmaydigan fayl uchun tushunarli xabarlar.\n\nBarcha hisoblar uchun to'liq fayldan foydalan. Asl ma'lumotlarni o'zgartirma. Hali avtomatik tozalash yoki grafik qo'shma.\n\napp.py, requirements.txt va qisqa README.md yarat yoki yangila. Loyihadagi mavjud ishlarni saqla.\n\nIlovani shu loyiha muhitida ishga tushir. Uning aniq mahalliy URL manzilini ber va server javob berishini tekshir. Sahifani brauzerda ko'ra olganing yoki olmaganingni alohida ayt. Men nimani o'zim tekshirishim kerakligini ayt.","promptChart":"Mavjud ilovamga Streamlit ichidagi ustunli grafik yordamida bitta grafik qo'sh. Qolgan funksiyalar ishlashda davom etsin.\n\nMenga kategoriya ustuni va sonli ustunni tanlash imkonini ber. Har bir kategoriya uchun sonli qiymatlar yig'indisini ko'rsat. Hisoblash uchun to'liq yuklangan fayldan foydalan. Aniq yig'indilarni grafik ostidagi kichik jadvalda ko'rsat. Ikkala o'qni va hisoblash usulini aniq yozib qo'y.\n\nYig'indi bo'yicha saralangan 20 tagacha kategoriyani ko'rsat. Grafikda faqat dastlabki 20 ta ko'rsatilsa, buni aniq ayt. Jadvalda barcha kategoriyalar yig'indilarini qoldir.\n\nBo'sh sonlarni nol bilan almashtirma. Guruhdagi barcha sonlar bo'sh bo'lsa, No data ko'rsat. Kategoriyasi bo'sh qatorlar haqida alohida xabar ber. Ishlatishga yaroqli sonli ustunlar bo'lmasa, ma'lumotlar ko'rinishi ishlashda davom etsin va nega grafikni ko'rsatib bo'lmasligini tushuntir.\n\nTekshirishda tekshiruv faylidan foydalan: A yig'indisi 30 va B yig'indisi 10 bo'lishi kerak. Faylga kira olmasang, check_dataset.csv faylini loyiha papkasiga joylayman. Mavjud bo'lmagan faylni o'qidim deb aytma. Ilovani ishga tushir va haqiqiy tekshiruv natijalarini ayt.","promptStyle":"Mavjud ilovani tanlovlarim asosida yangila:\nIlova nomi: {name}\nAsosiy rang: {accent}\nFon rangi: {background}\nBitta qo'shimcha funksiya: {feature}\n\nOddiy, o'qish oson bo'lgan ko'rinish va mavjud vositalardan foydalan: Python, Streamlit va pandas. Faqat shu bitta qo'shimcha funksiyani qo'sh. Asl ma'lumotlarni o'zgartirma; barcha mavjud hisoblar va grafik hisob-kitoblari to'g'ri qolsin.\n\nIlovani yana ishga tushir. Nima o'zgarganini va qo'shimcha funksiyani qanday tekshirishimni tushuntir. Ko'rinishni tekshira olmasang, buni ayt va ko'z bilan tekshirishim uchun qisqa ro'yxat ber.","promptTest":"Mavjud ilovamni tekshirishga yordam ber.\n\nShu tekshiruv CSV faylidan foydalan:\ncategory,value\nA,10\nA,20\nB,\nB,5\nB,5\n\nKutilgan natija: 5 qator, 2 ustun, value ustunida 1 ta bo'sh qiymat (shu ustunning 20%i), 1 ta ortiqcha to'liq bir xil qator, A yig'indisi 30 va B yig'indisi 10.\n\nFaqat matnli ustunlardan iborat CSV, bo'sh CSV, boshqa formatdagi fayl va barcha sonli qiymatlari bo'sh guruhni ham tekshir. Ilova tushunarli xabarlar berishi kerak; barcha qiymatlari bo'sh guruh aniq nolga aylanmasin.\n\nAmalda bajara oladigan tekshiruvlaringni bajar. Brauzerda bajara olmaydigan amallaring uchun qisqa qo'lda tekshirish qadamlarini ber va ularni TEKSHIRILMAGAN deb belgila. Faqat serverning javobi sahifa tekshirilganini tasdiqlamaydi.\n\nHaqiqiy natijalarni checks.txt fayliga saqla: kutilgan natija, kuzatilgan natija va holat. Avtomatik va qo'lda tekshiruvlarni alohida yoz. Tekshiruvdan o'tmasa, aynan shu muammoni tuzat va tegishli tekshiruvlarni qayta bajar. Dizaynim va asl ma'lumotlarni saqla.","promptSave":"Shu Dataset Explorer loyihasining ishlaydigan versiyasini saqla.\n\n1. Ilovaning oxirgi versiyasi loyiha muhitida ishga tushishini tekshir.\n2. app.py va requirements.txt fayllarini yangilab qo'y. Ilova ishlatadigan mavzu va yordamchi fayllarni ham saqla.\n3. Shu kompyuter uchun amaldagi sozlash va qayta ishga tushirish buyruqlari yozilgan qisqa README.md tayyorla. Tekshirilgan Python va paket versiyalarini yoz.\n4. checks.txt faylida faqat haqiqiy natijalar bo'lsin: natijalarni yoz va tekshirilmagan narsalarni aniq belgila. Natijasini aytmagunimcha, men qo'lda tekshiruvni bajardim deb yozma.\n5. Bu loyiha allaqachon Git ishlatsa, loyiha fayllarining mahalliy commitini saqla. Aks holda ishlaydigan fayllarni shu papkada saqla. Internetga chiqarma va push qilma.\n\nOxirida loyiha yo'lini, ilovaning mahalliy URL manzilini, saqlashim kerak bo'lgan fayllarni va keyinroq ilovani ishga tushirishingni so'rash uchun bitta gap ber.","promptHelp":"Shu mavjud Dataset Explorer ilovasidagi bitta muammoni tuzatishga yordam ber.\n\nNima qildim: {tried}\nNima kutgandim: {expected}\nNima bo'ldi / xatoning to'liq matni: {error}\n\nKerakli loyiha fayllarini va haqiqiy xatoni ko'rib chiq. Sababini top, kichik tuzatish kirit va tegishli tekshiruvni qayta bajar. Qolgan ishlaydigan funksiyalar va asl ma'lumotlarimni saqla. Amalda nimani tekshirganingni ayt. Tekshira olmagan narsalaringni TEKSHIRILMAGAN deb belgila.","promptLater":"Shu saqlangan Dataset Explorer loyihasini och. Ilovani ishga tushirish uchun uning mavjud Python muhiti va README.md faylidan foydalan. Uni o'zing ishga tushir va menga aniq mahalliy URL manzilini ber. Biror narsa ishlamasa, ishga tushirish muammosini tuzat va amalda nimani tekshirganingni ayt."}};

 const finish='<div class="finish-box"><div class="finish-top"><h3>'+esc(d.progress)+'</h3><span class="count" data-count>'+n+' / 7</span></div><div class="meter" role="progressbar" aria-label="'+esc(d.progress)+'" aria-valuemin="0" aria-valuemax="7" aria-valuenow="'+n+'"><div data-fill style="width:'+(n/7*100)+'%"></div></div><p>'+esc(d.progressNote)+'</p><p class="complete" id="complete"'+(n===7?'':' hidden')+'>'+esc(d.complete)+'</p><div class="check-bottom" style="padding:13px 0 0;margin-top:12px"><p style="margin:0">'+esc(d.localNote)+'</p><button class="reset" type="button" data-reset>'+esc(d.reset)+'</button></div></div>';
 const help='<section class="help-section" id="help"><h2 class="helper-head">'+esc(d.helpTitle)+'</h2><p class="test-intro" style="margin-top:10px">'+esc(d.helpSub)+'</p>'+d.helpItems.map(pair=>'<details><summary>'+esc(pair[0])+'</summary><div class="details-body"><p>'+esc(pair[1])+'</p></div></details>').join('')+'<div class="help-form">'+['tried','expected','error'].map((key,i)=>'<label class="field"><span>'+esc(d.helpFields[i])+'</span><textarea data-help="'+key+'" maxlength="4000">'+esc(state.help[key])+'</textarea></label>').join('')+'</div>'+prompt('promptHelp',d.promptLabels[6])+'<details class="sources"><summary>'+esc(d.sourceTitle)+'</summary><div class="details-body"><div class="source-links">'+SOURCES.map((url,i)=>'<a href="'+esc(url)+'" target="_blank" rel="noopener noreferrer">'+esc(d.sourceLabels[i])+' ↗</a>').join('')+'</div><p class="source-meta">'+esc(d.sourceNote)+'</p></div></details></section>';
 document.getElementById('app').innerHTML='<div class="wrap" id="top"><div class="hero"><p class="eyebrow">'+esc(d.eyebrow)+'</p><div class="hero-grid"><div><h1>'+esc(d.title)+'<span>'+esc(d.accent)+'</span></h1><p class="lede">'+esc(d.lede)+'</p><p class="hero-note">'+esc(d.heroNote)+'</p></div><div class="hero-sketch"><div class="preview-tag">'+esc(d.previewLabel)+'</div><div class="preview-metrics">'+[d.previewRows,d.previewColumns,d.previewMissing].map((s,i)=>'<div><b>'+[5,2,1][i]+'</b><span>'+esc(s)+'</span></div>').join('')+'</div><p class="preview-chart-label">'+esc(d.previewChart)+'</p><div class="sample-bars"><div class="sample-row"><b>A</b><div class="bar-track"><span style="width:90%"></span></div><b>30</b></div><div class="sample-row"><b>B</b><div class="bar-track"><span style="width:30%"></span></div><b>10</b></div></div><p class="sample-note">'+esc(d.previewNote)+'</p></div></div></div><div class="settings-bar"><p class="stack-bar"><strong>'+esc(d.stack)+'</strong>'+esc(d.stackNote)+'</p><button class="print" type="button" data-print>'+esc(d.print)+' ↗</button></div><div class="layout"><nav class="side" aria-label="'+esc(d.route)+'"><p>'+esc(d.route)+'</p>'+nav+'<div class="side-bottom"><span class="count" data-count>'+n+' / 7</span><div class="meter" role="progressbar" aria-label="'+esc(d.progress)+'" aria-valuemin="0" aria-valuemax="7" aria-valuenow="'+n+'"><div data-fill style="width:'+(n/7*100)+'%"></div></div><p>'+esc(d.progressNote)+'</p></div></nav><main class="content" id="guide">'+intro+prepare+choices+basics+chart+personal+verify+save+finish+help+'</main></div></div><footer><div class="wrap footer-row"><strong>'+esc(d.footerLeft)+'</strong><span>'+esc(d.footerRight)+'</span></div><div class="wrap"><p class="offline">'+esc(d.offline)+'</p></div></footer>';
 updateProfilePreview();observeSections();
}
function updateProfilePreview(){const p=state.profile,box=document.getElementById('profile-preview');box.style.backgroundColor=p.background;box.style.color=contrast(p.background);box.style.borderColor=p.accent;document.getElementById('mock-name').textContent=p.name.trim()||'Dataset Explorer';const b=document.getElementById('mock-button');b.style.backgroundColor=p.accent;b.style.color=contrast(p.accent);document.getElementById('mock-feature').textContent=feature();document.getElementById('custom-field').hidden=p.feature!==4;document.querySelectorAll('[data-color]').forEach(o=>o.textContent=p[o.dataset.color]);}
function updatePrompts(){document.querySelectorAll('[data-prompt]').forEach(el=>el.textContent=promptText(el.dataset.prompt));}
function updateChecks(){const n=state.checks.filter(Boolean).length;document.querySelectorAll('[data-count]').forEach(el=>el.textContent=n+' / 7');document.querySelectorAll('[data-fill]').forEach(el=>el.style.width=n/7*100+'%');document.querySelectorAll('[role=progressbar]').forEach(el=>el.setAttribute('aria-valuenow',String(n)));document.getElementById('complete').hidden=n!==7;document.querySelectorAll('[data-nav]').forEach(el=>{const i=Number(el.dataset.nav);el.classList.toggle('done',state.checks[i]);el.querySelector('b').textContent=state.checks[i]?'✓':String(i+1).padStart(2,'0');});}
function observeSections(){if(observer)observer.disconnect();if(!('IntersectionObserver' in window))return;observer=new IntersectionObserver(entries=>{const found=entries.filter(e=>e.isIntersecting).sort((a,b)=>b.intersectionRatio-a.intersectionRatio)[0];if(found){document.querySelectorAll('[data-nav]').forEach(el=>{if(IDS[Number(el.dataset.nav)]===found.target.id)el.setAttribute('aria-current','step');else el.removeAttribute('aria-current');});}},{rootMargin:'-90px 0px -55% 0px',threshold:0});IDS.forEach(id=>observer.observe(document.getElementById(id)));}
let toastTimer;
function toast(message){const el=document.getElementById('toast');el.textContent=message;el.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.hidden=true,2600);}
async function copyPrompt(key,button){const source=document.getElementById(key),value=source.textContent;try{if(navigator.clipboard&&window.isSecureContext)await navigator.clipboard.writeText(value);else{const el=document.createElement('textarea');el.value=value;el.style.position='fixed';el.style.top='-9999px';el.setAttribute('readonly','');document.body.appendChild(el);el.select();const ok=document.execCommand('copy');el.remove();if(!ok)throw Error('copy');}button.textContent=t().copied;setTimeout(()=>{if(button.isConnected)button.textContent=t().copy;},1600);toast(t().copied);}catch(e){const range=document.createRange();range.selectNodeContents(source);const s=window.getSelection();s.removeAllRanges();s.addRange(range);toast(t().copyFail);}}
function downloadFixture(id){const f=fixtures[id];if(!f)return;const url=URL.createObjectURL(new Blob([f.text],{type:f.type}));const a=document.createElement('a');a.href=url;a.download=f.name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.lang&&Object.hasOwn(T,b.dataset.lang)){const y=window.scrollY;state.lang=b.dataset.lang;storeState();render();window.scrollTo({top:y,behavior:'instant'});document.querySelector('[data-lang="'+state.lang+'"]').focus({preventScroll:true});}else if(b.dataset.copy){copyPrompt(b.dataset.copy,b);}else if(b.dataset.download){downloadFixture(b.dataset.download);}else if(b.hasAttribute('data-print'))window.print();else if(b.hasAttribute('data-reset')&&window.confirm(t().resetConfirm)){state.checks=Array(7).fill(false);storeState();document.querySelectorAll('[data-check]').forEach(el=>el.checked=false);updateChecks();}});
function fieldUpdate(el){if(el.dataset.profile){const k=el.dataset.profile;state.profile[k]=k==='feature'?Number(el.value):el.value;storeState();updateProfilePreview();updatePrompts();}else if(el.dataset.help){state.help[el.dataset.help]=el.value;updatePrompts();}}
document.addEventListener('input',e=>fieldUpdate(e.target));document.addEventListener('change',e=>{const el=e.target;if(el.matches('[data-check]')){state.checks[Number(el.dataset.check)]=el.checked;storeState();updateChecks();}else fieldUpdate(el);});
render();
</script></body></html>
